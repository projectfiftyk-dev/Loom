# The Lighthouse Secret — StoryFormat v0.2 demo book

metadata:
  title: "The Lighthouse Secret"
  author: "Jane Doe"
  version: "0.2"
  language: "en"
  description: >
    A mystery set on a remote island. Uncover the truth behind a
    century-old shipwreck and the keeper who guards its secret.
  tags:
    - mystery
    - historical
    - drama

settings:
  ai_model: "gpt-4o-mini"
  default_voice: "neutral"
  allow_chat_rewind: false
  max_free_text_attempts: 3

characters:
  - id: elara
    name: "Elara Voss"
    voice: "warm_female"
    personality: >
      You are Elara, a retired lighthouse keeper in your seventies. You speak
      slowly and choose your words carefully. You know a secret about the night
      the ship sank but will not reveal it unless truly pressed. You are kind
      but guarded. Respond in short, careful sentences. You remember everything
      the player has told you.

  - id: captain_dorn
    name: "Captain Dorn"
    voice: "gruff_male"
    personality: >
      You are Captain Dorn, a weathered harbour captain suspicious of outsiders.
      You speak in gruff, short answers. You will not discuss the cargo unless
      the player has already found evidence. You are hiding something and
      deflect direct questions with hostility.

scenes:

  # ── ACT 1 ─────────────────────────────────────────
  - id: scene_01
    title: "Arrival at the Lighthouse"
    start: true
    nodes:

      - id: n01_intro
        type: dialogue
        character: narrator
        text: >
          The ferry drops you on the rocky shore. Spray whips across the dock
          as the boat turns back toward the mainland. Above you, the old
          lighthouse looms against a grey November sky. Someone is watching
          from the upper window.
        next: n01_elara_greets

      - id: n01_elara_greets
        type: dialogue
        character: elara
        text: "You're the journalist? I expected someone older."
        next: n01_choice_reply

      - id: n01_choice_reply
        type: choice
        prompt: "How do you respond?"
        options:
          - label: "I'm full of surprises."
            next: n01_elara_laugh
          - label: "I just need answers about the wreck."
            next: n01_elara_cold
          - label: "Sorry to disappoint."
            next: n01_elara_laugh
          - label: "[Stay silent]"
            next: n01_elara_cold

      - id: n01_elara_laugh
        type: dialogue
        character: elara
        text: "Ha. Come in, then. Mind the step — it's been loose for forty years."
        next: scene_02

      - id: n01_elara_cold
        type: dialogue
        character: elara
        text: "Hmm. Follow me. And don't touch anything."
        next: scene_02

  # ── ACT 2 ─────────────────────────────────────────
  - id: scene_02
    title: "The Keeper's Study"
    nodes:

      - id: n02_ghost_whisper
        type: dialogue
        character:
          id: voice
          name: "A Voice"
          avatar: null
          voice: "whisper"
          personality: null
        text: "…check behind the painting…"
        next: n02_painting_choice

      - id: n02_painting_choice
        type: choice
        prompt: "Three paintings hang on the wall. Which do you inspect?"
        options:
          - label: "The seascape with the red boat."
            correct: true
            next: n02_found_ledger
          - label: "The portrait of a stern admiral."
            correct: false
            next: n02_wrong_painting
          - label: "The abstract swirl of colours."
            correct: false
            next: n02_wrong_painting

      - id: n02_found_ledger
        type: dialogue
        character: narrator
        text: >
          Behind the seascape, taped flat against the wall: a water-stained
          ledger. The pages are fragile but the numbers are still legible.
          Someone went to great lengths to hide this.
        next: n02_free_text_deduction

      - id: n02_wrong_painting
        type: dialogue
        character: narrator
        text: "Nothing unusual here. The voice echoes again — insistent."
        next: n02_painting_choice

      - id: n02_free_text_deduction
        type: free_text
        prompt: "What do the ledger entries tell you?"
        hint: "Look at the dates and cargo weights on the last page."
        goal: >
          The player should conclude that the cargo was secretly doubled the
          night before the wreck, implying the ship was overloaded on purpose
          — or that someone deliberately caused the sinking.
        on_success: n02_deduction_confirmed
        on_fail: n02_deduction_retry
        max_attempts: 3
        on_exhausted: n02_elara_hint

      - id: n02_deduction_confirmed
        type: dialogue
        character: narrator
        text: >
          The pieces fall into place. The cargo weight on the night of the
          wreck was double what the manifest declared. Someone wanted that
          ship to sink.
        next: n02_chat_unlock

      - id: n02_deduction_retry
        type: dialogue
        character: narrator
        text: "You sense you're missing something. The numbers blur. Try again."
        next: n02_free_text_deduction

      - id: n02_elara_hint
        type: dialogue
        character: elara
        text: "Look at the weight column on the last page, dear. The night of the twenty-third."
        next: n02_free_text_deduction

      - id: n02_chat_unlock
        type: chat
        character: elara
        context_up_to: n02_chat_unlock
        entry_line: "You look like you've figured something out. Ask me what you need to ask."
        standalone: false
        next: scene_03

  # ── ACT 3 ─────────────────────────────────────────
  - id: scene_03
    title: "Confronting the Captain"
    nodes:

      - id: n03_dorn_meet
        type: dialogue
        character: captain_dorn
        text: "What do you want?"
        next: n03_choice_approach

      - id: n03_choice_approach
        type: choice
        prompt: "How do you approach him?"
        options:
          - label: "Show him the ledger directly."
            next: n03_dorn_shocked
          - label: "Mention the doubled cargo subtly."
            next: n03_dorn_deflects
          - label: "Ask about the night of the wreck."
            next: n03_dorn_deflects

      - id: n03_dorn_shocked
        type: dialogue
        character: captain_dorn
        text: "Where did you get that…? That was supposed to be destroyed."
        next: scene_04_truth

      - id: n03_dorn_deflects
        type: dialogue
        character: captain_dorn
        text: "I don't know what you're talking about. Leave before I call the harbour master."
        next: scene_04_coverup

  # ── ENDINGS ───────────────────────────────────────
  - id: scene_04_truth
    title: "The Truth Surfaces"
    end: true
    nodes:
      - id: n04_end_a
        type: dialogue
        character: narrator
        text: >
          The captain's composure crumbles. In the hours that follow, the full
          story comes out — the insurance fraud, the deliberate overloading,
          the eleven lives lost. The ledger is everything you needed.
          Some secrets, when they finally surface, change everything.

  - id: scene_04_coverup
    title: "The Silence Holds"
    end: true
    nodes:
      - id: n04_end_b
        type: dialogue
        character: narrator
        text: >
          You leave empty-handed. The captain watches from the dock as the
          ferry pulls away. Elara's light blinks twice in the fog —
          a farewell, or a warning. Some secrets stay buried.

standalone_chats:
  - character: elara
    unlock_after: scene_01
  - character: captain_dorn
    unlock_after: scene_03
