<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="#4A8AC4"/>
  <circle cx="60" cy="60" r="55" fill="#5A9AD4"/>
  <!-- Shell back -->
  <ellipse cx="60" cy="64" rx="38" ry="32" fill="#3A7A40"/>
  <!-- Shell pattern hexagons -->
  <ellipse cx="60" cy="60" rx="16" ry="14" fill="#4A9A50"/>
  <ellipse cx="60" cy="60" rx="10" ry="9" fill="#5AAA60"/>
  <ellipse cx="40" cy="55" rx="9" ry="8" fill="#4A9A50" opacity="0.7"/>
  <ellipse cx="80" cy="55" rx="9" ry="8" fill="#4A9A50" opacity="0.7"/>
  <ellipse cx="42" cy="70" rx="9" ry="8" fill="#4A9A50" opacity="0.7"/>
  <ellipse cx="78" cy="70" rx="9" ry="8" fill="#4A9A50" opacity="0.7"/>
  <ellipse cx="60" cy="75" rx="9" ry="7" fill="#4A9A50" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="60" cy="36" rx="22" ry="18" fill="#6AAA58"/>
  <!-- Eyes - wise and calm, slightly sleepy -->
  <circle cx="51" cy="33" r="7" fill="white"/>
  <circle cx="69" cy="33" r="7" fill="white"/>
  <!-- Half-closed eyelids for wise look -->
  <path d="M 44,29 Q 51,25 58,29" fill="#6AAA58"/>
  <path d="M 62,29 Q 69,25 76,29" fill="#6AAA58"/>
  <circle cx="52" cy="34" r="4" fill="#2A3A18"/>
  <circle cx="70" cy="34" r="4" fill="#2A3A18"/>
  <circle cx="53" cy="33" r="1.5" fill="white"/>
  <circle cx="71" cy="33" r="1.5" fill="white"/>
  <!-- Small calm smile -->
  <path d="M 53,43 Q 60,48 67,43" fill="none" stroke="#4A7A38" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs peeking out -->
  <ellipse cx="34" cy="80" rx="12" ry="7" fill="#6AAA58"/>
  <ellipse cx="86" cy="80" rx="12" ry="7" fill="#6AAA58"/>
  <ellipse cx="40" cy="90" rx="10" ry="6" fill="#6AAA58"/>
  <ellipse cx="80" cy="90" rx="10" ry="6" fill="#6AAA58"/>
</svg>
