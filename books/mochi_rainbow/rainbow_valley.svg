<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="grey_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9AB0"/>
      <stop offset="55%" stop-color="#B8C4D0"/>
      <stop offset="100%" stop-color="#D8D0C0"/>
    </linearGradient>
    <linearGradient id="valley_grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8A3A"/>
      <stop offset="100%" stop-color="#3A6A28"/>
    </linearGradient>
    <radialGradient id="cloud_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grey dull sky - rainbow gone -->
  <rect width="1200" height="675" fill="url(#grey_sky)"/>

  <!-- Hint of faded rainbow arc - pale and broken -->
  <path d="M 0,400 Q 600,50 1200,400" fill="none" stroke="#C8A0A0" stroke-width="12" opacity="0.18"/>
  <path d="M 0,420 Q 600,70 1200,420" fill="none" stroke="#C8C890" stroke-width="10" opacity="0.13"/>
  <path d="M 0,440 Q 600,90 1200,440" fill="none" stroke="#90A8C8" stroke-width="10" opacity="0.13"/>

  <!-- Distant hills -->
  <ellipse cx="200" cy="420" rx="320" ry="120" fill="#6A9A48" opacity="0.6"/>
  <ellipse cx="900" cy="410" rx="380" ry="110" fill="#5A8A3A" opacity="0.6"/>
  <ellipse cx="1150" cy="430" rx="200" ry="90" fill="#6A9A48" opacity="0.5"/>
  <ellipse cx="50" cy="440" rx="180" ry="80" fill="#5A8A3A" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="490" width="1200" height="185" fill="url(#valley_grass)"/>
  <rect x="0" y="490" width="1200" height="6" fill="#7AAA50" opacity="0.7"/>

  <!-- Grass tufts along ground -->
  <ellipse cx="100" cy="493" rx="30" ry="8" fill="#7ABB50" opacity="0.6"/>
  <ellipse cx="250" cy="492" rx="22" ry="6" fill="#7ABB50" opacity="0.5"/>
  <ellipse cx="450" cy="493" rx="28" ry="7" fill="#7ABB50" opacity="0.6"/>
  <ellipse cx="700" cy="492" rx="25" ry="6" fill="#7ABB50" opacity="0.5"/>
  <ellipse cx="950" cy="493" rx="32" ry="8" fill="#7ABB50" opacity="0.6"/>
  <ellipse cx="1100" cy="492" rx="20" ry="6" fill="#7ABB50" opacity="0.5"/>

  <!-- Flowers on ground - grey/faded without rainbow -->
  <circle cx="180" cy="500" r="6" fill="#A8A090" opacity="0.7"/>
  <circle cx="350" cy="498" r="5" fill="#B0A898" opacity="0.7"/>
  <circle cx="550" cy="500" r="7" fill="#A8A090" opacity="0.7"/>
  <circle cx="850" cy="499" r="6" fill="#B0A898" opacity="0.7"/>
  <circle cx="1050" cy="500" r="5" fill="#A8A090" opacity="0.7"/>

  <!-- Distant trees -->
  <rect x="80" y="380" width="18" height="120" fill="#4A3820"/>
  <ellipse cx="89" cy="375" rx="35" ry="45" fill="#4A7030" opacity="0.7"/>
  <rect x="160" y="390" width="15" height="110" fill="#4A3820"/>
  <ellipse cx="167" cy="385" rx="28" ry="38" fill="#4A7030" opacity="0.7"/>
  <rect x="1050" y="370" width="18" height="130" fill="#4A3820"/>
  <ellipse cx="1059" cy="365" rx="38" ry="48" fill="#4A7030" opacity="0.7"/>
  <rect x="1120" y="385" width="16" height="115" fill="#4A3820"/>
  <ellipse cx="1128" cy="380" rx="30" ry="40" fill="#4A7030" opacity="0.7"/>

  <!-- Clouds (grey without rainbow light) -->
  <ellipse cx="250" cy="110" rx="90" ry="40" fill="#D0CECE" opacity="0.8"/>
  <ellipse cx="310" cy="100" rx="70" ry="35" fill="#DDDAD8" opacity="0.8"/>
  <ellipse cx="190" cy="115" rx="60" ry="30" fill="#D0CECE" opacity="0.8"/>
  <ellipse cx="850" cy="90" rx="100" ry="42" fill="#D0CECE" opacity="0.8"/>
  <ellipse cx="920" cy="80" rx="75" ry="36" fill="#DDDAD8" opacity="0.8"/>
  <ellipse cx="780" cy="95" rx="65" ry="32" fill="#D0CECE" opacity="0.8"/>

  <!-- PATH where gems used to shine -->
  <ellipse cx="600" cy="496" rx="80" ry="10" fill="#9AB080" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MOCHI character in center of scene          -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Mochi body - small round bear -->
  <ellipse cx="600" cy="555" rx="52" ry="45" fill="#F0A040"/>
  <!-- Mochi shadow -->
  <ellipse cx="600" cy="598" rx="48" ry="10" fill="#3A6A28" opacity="0.3"/>
  <!-- Mochi ears -->
  <circle cx="566" cy="508" r="20" fill="#E8882A"/>
  <circle cx="634" cy="508" r="20" fill="#E8882A"/>
  <circle cx="566" cy="508" r="11" fill="#F5B870"/>
  <circle cx="634" cy="508" r="11" fill="#F5B870"/>
  <!-- Mochi head -->
  <circle cx="600" cy="525" r="42" fill="#F5A050"/>
  <!-- Mochi snout -->
  <ellipse cx="600" cy="538" rx="20" ry="14" fill="#F0C080"/>
  <!-- Mochi eyes - big worried eyes (rainbow gone!) -->
  <circle cx="587" cy="520" r="11" fill="white"/>
  <circle cx="613" cy="520" r="11" fill="white"/>
  <circle cx="589" cy="522" r="7" fill="#2A1A0A"/>
  <circle cx="615" cy="522" r="7" fill="#2A1A0A"/>
  <circle cx="591" cy="520" r="2.5" fill="white"/>
  <circle cx="617" cy="520" r="2.5" fill="white"/>
  <!-- Worried eyebrows -->
  <path d="M 579,511 Q 587,507 595,510" fill="none" stroke="#C05820" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 605,510 Q 613,507 621,511" fill="none" stroke="#C05820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mochi nose -->
  <ellipse cx="600" cy="533" rx="5" ry="4" fill="#C05820"/>
  <!-- Sad mouth -->
  <path d="M 592,543 Q 600,540 608,543" fill="none" stroke="#C05820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="578" cy="530" r="8" fill="#F08040" opacity="0.35"/>
  <circle cx="622" cy="530" r="8" fill="#F08040" opacity="0.35"/>
  <!-- Mochi paws raised - looking up at grey sky -->
  <ellipse cx="553" cy="570" rx="18" ry="14" fill="#F0A040"/>
  <ellipse cx="647" cy="570" rx="18" ry="14" fill="#F0A040"/>
  <!-- Mochi arms up -->
  <path d="M 565,558 Q 548,560 550,572" fill="none" stroke="#F0A040" stroke-width="12" stroke-linecap="round"/>
  <path d="M 635,558 Q 652,560 650,572" fill="none" stroke="#F0A040" stroke-width="12" stroke-linecap="round"/>

  <!-- Tear drop from Mochi's eye -->
  <ellipse cx="583" cy="532" rx="3" ry="4" fill="#A8C8E8" opacity="0.7"/>

  <!-- Speech bubble -->
  <rect x="630" y="455" width="220" height="52" fill="white" rx="16" opacity="0.95"/>
  <polygon points="650,507 665,507 658,525" fill="white" opacity="0.95"/>
  <text x="740" y="477" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="14" fill="#C05820" text-anchor="middle" font-weight="bold">The rainbow is GONE!</text>
  <text x="740" y="497" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="14" fill="#C05820" text-anchor="middle" font-weight="bold">Will you help me? 🌈</text>

  <!-- Label -->
  <text x="60" y="655" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#F0E8D8" opacity="0.65" font-style="italic">Rainbow Valley · The Adventure Begins</text>
</svg>
