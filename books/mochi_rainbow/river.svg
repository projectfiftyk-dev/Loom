<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="river_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A8D8"/>
      <stop offset="60%" stop-color="#90C8E8"/>
      <stop offset="100%" stop-color="#B8E0F0"/>
    </linearGradient>
    <linearGradient id="river_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5090C8"/>
      <stop offset="50%" stop-color="#3A78B0"/>
      <stop offset="100%" stop-color="#284A80"/>
    </linearGradient>
    <linearGradient id="river_bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6AAA40"/>
      <stop offset="100%" stop-color="#4A8828"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#river_sky)"/>

  <!-- Soft clouds -->
  <ellipse cx="180" cy="80" rx="90" ry="38" fill="white" opacity="0.85"/>
  <ellipse cx="240" cy="68" rx="70" ry="32" fill="white" opacity="0.85"/>
  <ellipse cx="130" cy="86" rx="58" ry="26" fill="white" opacity="0.8"/>
  <ellipse cx="900" cy="65" rx="100" ry="42" fill="white" opacity="0.85"/>
  <ellipse cx="975" cy="55" rx="78" ry="35" fill="white" opacity="0.85"/>
  <ellipse cx="830" cy="70" rx="62" ry="30" fill="white" opacity="0.8"/>

  <!-- Far bank trees -->
  <rect x="0" y="260" width="45" height="240" fill="#3A5A28"/>
  <ellipse cx="22" cy="255" rx="48" ry="60" fill="#3A6A20" opacity="0.85"/>
  <rect x="100" y="280" width="38" height="220" fill="#3A5A28"/>
  <ellipse cx="119" cy="272" rx="40" ry="52" fill="#4A7828" opacity="0.85"/>
  <rect x="1050" y="265" width="42" height="235" fill="#3A5A28"/>
  <ellipse cx="1071" cy="258" rx="48" ry="58" fill="#3A6A20" opacity="0.85"/>
  <rect x="1140" y="278" width="60" height="222" fill="#3A5A28"/>
  <ellipse cx="1170" cy="270" rx="55" ry="62" fill="#4A7828" opacity="0.85"/>

  <!-- Far bank grass -->
  <rect x="0" y="310" width="1200" height="120" fill="#5A9838" opacity="0.9"/>
  <rect x="0" y="310" width="1200" height="5" fill="#7AB850" opacity="0.7"/>

  <!-- RIVER — takes up center band -->
  <rect x="0" y="375" width="1200" height="160" fill="url(#river_water)"/>
  <!-- Water shimmer/ripple lines -->
  <path d="M 0,395 Q 100,388 200,395 Q 300,402 400,395 Q 500,388 600,395 Q 700,402 800,395 Q 900,388 1000,395 Q 1100,402 1200,395" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <path d="M 0,415 Q 120,408 240,415 Q 360,422 480,415 Q 600,408 720,415 Q 840,422 960,415 Q 1080,408 1200,415" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <path d="M 0,435 Q 90,428 180,435 Q 270,442 360,435 Q 450,428 540,435 Q 630,442 720,435 Q 810,428 900,435 Q 990,442 1080,435 Q 1170,428 1200,435" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  <path d="M 0,460 Q 150,453 300,460 Q 450,467 600,460 Q 750,453 900,460 Q 1050,467 1200,460" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Near bank -->
  <rect x="0" y="530" width="1200" height="145" fill="url(#river_bank)"/>
  <rect x="0" y="530" width="1200" height="5" fill="#8ACC58" opacity="0.6"/>
  <!-- Riverbank pebbles -->
  <ellipse cx="200" cy="535" rx="14" ry="6" fill="#8A8878" opacity="0.7"/>
  <ellipse cx="240" cy="533" rx="10" ry="5" fill="#9A9888" opacity="0.7"/>
  <ellipse cx="800" cy="534" rx="12" ry="5" fill="#8A8878" opacity="0.7"/>
  <ellipse cx="840" cy="536" rx="9" ry="4" fill="#9A9888" opacity="0.7"/>

  <!-- Water lilies -->
  <ellipse cx="300" cy="420" rx="22" ry="12" fill="#4AAA30" opacity="0.7"/>
  <circle cx="300" cy="416" r="7" fill="#F8D0E0"/>
  <circle cx="300" cy="416" r="4" fill="#F0A0B0"/>
  <ellipse cx="900" cy="430" rx="20" ry="10" fill="#4AAA30" opacity="0.7"/>
  <circle cx="900" cy="426" r="6" fill="#F8D0E0"/>
  <circle cx="900" cy="426" r="3.5" fill="#F0A0B0"/>

  <!-- Blue gem underwater (glowing under the sad fish) -->
  <ellipse cx="600" cy="490" rx="25" ry="20" fill="#60C0FF" opacity="0.4"/>
  <polygon points="590,480 605,463 620,480 605,500" fill="#3090E8" opacity="0.85"/>
  <polygon points="590,480 605,463 620,480 605,500" fill="none" stroke="#80D0FF" stroke-width="2"/>
  <ellipse cx="605" cy="480" rx="9" ry="7" fill="#A0E0FF" opacity="0.7"/>

  <!-- ═════════════════════════════════════════════════════ -->
  <!-- SAD FISH sitting on gem — center of river           -->
  <!-- ═════════════════════════════════════════════════════ -->
  <!-- Fish body -->
  <ellipse cx="605" cy="452" rx="38" ry="26" fill="#4080C8"/>
  <ellipse cx="602" cy="450" rx="34" ry="22" fill="#5090D8"/>
  <!-- Fish scales hint -->
  <path d="M 580,445 Q 590,440 600,445 Q 610,440 620,445 Q 630,440 635,445" fill="none" stroke="#3870B0" stroke-width="1.5" opacity="0.5"/>
  <path d="M 575,455 Q 585,450 595,455 Q 605,450 615,455 Q 625,450 635,455" fill="none" stroke="#3870B0" stroke-width="1.5" opacity="0.5"/>
  <!-- Fish tail -->
  <polygon points="640,440 670,428 670,470 640,462" fill="#3878C0"/>
  <!-- Fish BIG sad eyes -->
  <circle cx="578" cy="448" r="13" fill="white"/>
  <circle cx="581" cy="450" r="9" fill="#1A3A7A"/>
  <circle cx="583" cy="448" r="3" fill="white"/>
  <!-- Sad eyebrow -->
  <path d="M 570,438 Q 578,433 586,437" fill="none" stroke="#2858A0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sad mouth -->
  <path d="M 575,460 Q 582,455 590,460" fill="none" stroke="#2858A0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big teardrop -->
  <ellipse cx="572" cy="468" rx="5" ry="7" fill="#A8D8F8" opacity="0.9"/>
  <ellipse cx="572" cy="474" rx="3" ry="3" fill="#A8D8F8" opacity="0.7"/>
  <!-- Dorsal fin -->
  <polygon points="595,428 605,410 618,428" fill="#3878C0"/>
  <!-- Side fins -->
  <ellipse cx="600" cy="472" rx="16" ry="8" fill="#3878C0" opacity="0.8" transform="rotate(-20 600 472)"/>

  <!-- Small water splash/ripple around fish -->
  <ellipse cx="605" cy="500" rx="50" ry="10" fill="none" stroke="#80C0E8" stroke-width="2" opacity="0.5"/>
  <ellipse cx="605" cy="500" rx="70" ry="14" fill="none" stroke="#80C0E8" stroke-width="1.5" opacity="0.3"/>

  <!-- ═════════════════════════════════════════════════════ -->
  <!-- MOCHI — kneeling at riverbank, reaching toward fish -->
  <!-- ═════════════════════════════════════════════════════ -->
  <!-- Mochi shadow -->
  <ellipse cx="820" cy="552" rx="42" ry="9" fill="#3A7820" opacity="0.3"/>
  <!-- Mochi body — crouched/leaning forward -->
  <ellipse cx="825" cy="545" rx="42" ry="36" fill="#F0A040"/>
  <!-- Ears -->
  <circle cx="798" cy="502" r="16" fill="#E8882A"/>
  <circle cx="855" cy="502" r="16" fill="#E8882A"/>
  <circle cx="798" cy="502" r="9" fill="#F5B870"/>
  <circle cx="855" cy="502" r="9" fill="#F5B870"/>
  <!-- Head tilted forward -->
  <circle cx="825" cy="518" r="34" fill="#F5A050"/>
  <!-- Snout -->
  <ellipse cx="825" cy="530" rx="16" ry="11" fill="#F0C080"/>
  <!-- Caring eyes looking at fish -->
  <circle cx="814" cy="513" r="9" fill="white"/>
  <circle cx="836" cy="513" r="9" fill="white"/>
  <circle cx="815" cy="514" r="6" fill="#2A1A0A"/>
  <circle cx="837" cy="514" r="6" fill="#2A1A0A"/>
  <circle cx="817" cy="512" r="2" fill="white"/>
  <circle cx="839" cy="512" r="2" fill="white"/>
  <!-- Gentle worried brow -->
  <path d="M 807,505 Q 814,501 821,504" fill="none" stroke="#C05820" stroke-width="2" stroke-linecap="round"/>
  <path d="M 829,504 Q 836,501 843,505" fill="none" stroke="#C05820" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="825" cy="525" rx="4" ry="3" fill="#C05820"/>
  <!-- Kind open-mouth expression -->
  <path d="M 818,534 Q 825,539 832,534" fill="none" stroke="#C05820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="806" cy="523" r="6" fill="#F08040" opacity="0.35"/>
  <circle cx="844" cy="523" r="6" fill="#F08040" opacity="0.35"/>
  <!-- Arm reaching out to fish with concern -->
  <path d="M 791,538 Q 758,490 720,465" fill="none" stroke="#F0A040" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="714" cy="461" rx="13" ry="10" fill="#F0A040"/>
  <!-- Other arm on bank for balance -->
  <path d="M 860,548 Q 870,558 872,570" fill="none" stroke="#F0A040" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="874" cy="574" rx="12" ry="9" fill="#F0A040"/>

  <!-- Speech bubble from Mochi -->
  <rect x="868" y="465" width="260" height="44" fill="white" rx="14" opacity="0.95"/>
  <polygon points="875,509 890,509 882,528" fill="white" opacity="0.95"/>
  <text x="998" y="484" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="13" fill="#C05820" text-anchor="middle" font-weight="bold">Are you okay, little fish?</text>
  <text x="998" y="500" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="13" fill="#C05820" text-anchor="middle" font-weight="bold">You look so sad! 💙</text>

  <!-- Label -->
  <text x="60" y="655" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#E0F0F8" opacity="0.65" font-style="italic">The Sparkling River · The Blue Gem</text>
</svg>
