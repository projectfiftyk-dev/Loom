  <!-- Wicker pattern lines -->
  <line x1="652" y1="440" x2="686" y2="440" stroke="#7A5828" stroke-width="1.5"/>
  <line x1="652" y1="450" x2="686" y2="450" stroke="#7A5828" stroke-width="1.5"/>
  <line x1="652" y1="460" x2="686" y2="460" stroke="#7A5828" stroke-width="1.5"/>
