  <circle cx="378" cy="437" r="38" fill="#C89820"/>
  <circle cx="378" cy="437" r="30" fill="#A07010"/>
  <text x="378" y="444" font-family="Georgia,serif" font-size="26" fill="#E8D050" text-anchor="middle" font-weight="bold">Λ</text>

