  <line x1="1000" y1="505" x2="1080" y2="518" stroke="#C0A050" stroke-width="3" opacity="0.45"/>
  <ellipse cx="920" cy="512" rx="22" ry="14" fill="#7A5A28" opacity="0.5"/>
