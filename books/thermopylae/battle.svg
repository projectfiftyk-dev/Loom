  <circle cx="320" cy="438" r="42" fill="#7A5810"/>
  <circle cx="320" cy="438" r="38" fill="#C89820"/>
  <circle cx="320" cy="438" r="30" fill="#A07010"/>
  <text x="320" y="445" font-family="Georgia,serif" font-size="26" fill="#E8D050" text-anchor="middle" font-weight="bold">Λ</text>

