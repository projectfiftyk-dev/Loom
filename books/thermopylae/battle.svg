<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="battle_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1820"/>
      <stop offset="40%" stop-color="#3A3038"/>
      <stop offset="100%" stop-color="#5A4840"/>
    </linearGradient>
    <linearGradient id="battle_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A5840"/>
      <stop offset="100%" stop-color="#4A3A28"/>
    </linearGradient>
    <radialGradient id="battle_glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#C87820" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C87820" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark, smoky battle sky -->
  <rect width="1200" height="675" fill="url(#battle_sky)"/>
  <rect width="1200" height="675" fill="url(#battle_glow)"/>

  <!-- Smoke and dust of battle -->
  <ellipse cx="400" cy="200" rx="300" ry="100" fill="#8A7860" opacity="0.2"/>
  <ellipse cx="800" cy="180" rx="280" ry="90" fill="#8A7860" opacity="0.15"/>
  <ellipse cx="600" cy="280" rx="400" ry="80" fill="#C88040" opacity="0.08"/>

  <!-- CLIFF WALLS narrowing in from both sides — tight space -->
  <!-- Left cliff face -->
  <rect x="0" y="0" width="180" height="675" fill="#2A2620"/>
  <path d="M 180,0 Q 160,100 170,200 Q 165,350 175,500 Q 170,600 180,675" fill="#1A1810" opacity="0.5"/>
  <!-- Rock striations left -->
  <path d="M 0,120 Q 80,108 180,122" fill="none" stroke="#3A3028" stroke-width="2" opacity="0.5"/>
  <path d="M 0,250 Q 80,238 180,252" fill="none" stroke="#3A3028" stroke-width="2" opacity="0.4"/>
  <path d="M 0,400 Q 80,388 180,402" fill="none" stroke="#3A3028" stroke-width="2" opacity="0.4"/>

  <!-- Right cliff face -->
  <rect x="1020" y="0" width="180" height="675" fill="#2A2620"/>
  <path d="M 1020,0 Q 1040,100 1030,200 Q 1035,350 1025,500 Q 1030,600 1020,675" fill="#1A1810" opacity="0.5"/>
  <!-- Rock striations right -->
  <path d="M 1200,120 Q 1120,108 1020,122" fill="none" stroke="#3A3028" stroke-width="2" opacity="0.5"/>
  <path d="M 1200,250 Q 1120,238 1020,252" fill="none" stroke="#3A3028" stroke-width="2" opacity="0.4"/>

  <!-- Battle ground floor — bloody churned earth -->
  <rect x="0" y="490" width="1200" height="185" fill="url(#battle_floor)"/>
  <rect x="0" y="490" width="1200" height="4" fill="#5A4830" opacity="0.7"/>
  <!-- Dark stains on ground -->
  <ellipse cx="900" cy="498" rx="60" ry="12" fill="#3A1A10" opacity="0.4"/>
  <ellipse cx="1050" cy="502" rx="45" ry="10" fill="#3A1A10" opacity="0.3"/>
  <ellipse cx="970" cy="515" rx="30" ry="8" fill="#3A1A10" opacity="0.4"/>

