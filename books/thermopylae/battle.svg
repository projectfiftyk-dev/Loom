  <polygon points="666,340 674,337 671,323" fill="#D0B840"/>
  <line x1="740" y1="338" x2="720" y2="430" stroke="#A08040" stroke-width="4"/>
  <polygon points="736,338 744,335 741,321" fill="#D0B840"/>
  <line x1="810" y1="340" x2="790" y2="430" stroke="#A08040" stroke-width="4"/>
  <polygon points="806,340 814,337 811,323" fill="#D0B840"/>
  <line x1="880" y1="338" x2="860" y2="430" stroke="#A08040" stroke-width="4"/>
  <polygon points="876,338 884,335 881,321" fill="#D0B840"/>

