  <circle cx="685" cy="385" r="4" fill="#2A1A08"/>
  <path d="M 672,393 Q 680,398 688,393" fill="none" stroke="#9A5828" stroke-width="2"/>

  <ellipse cx="750" cy="415" rx="28" ry="23" fill="#A86828"/>
  <ellipse cx="750" cy="394" rx="17" ry="14" fill="#C08038"/>
  <circle cx="746" cy="390" r="3.5" fill="#2A1A08"/>
