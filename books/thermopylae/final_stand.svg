<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="finale_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="30%" stop-color="#1A1828"/>
      <stop offset="65%" stop-color="#3A2A30"/>
      <stop offset="100%" stop-color="#5A3A30"/>
    </linearGradient>
    <linearGradient id="hill_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A4838"/>
      <stop offset="100%" stop-color="#3A2C20"/>
    </linearGradient>
    <radialGradient id="fire_glow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E85020" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E85020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="torch_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0A030" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0A030" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky — stars, darkness -->
  <rect width="1200" height="675" fill="url(#finale_sky)"/>
  <rect width="1200" height="675" fill="url(#fire_glow)"/>

  <!-- Stars -->
  <circle cx="100" cy="40" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="200" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="320" cy="55" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="480" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="650" cy="20" r="2" fill="white" opacity="0.6"/>
  <circle cx="780" cy="45" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="920" cy="28" r="1" fill="white" opacity="0.6"/>
  <circle cx="1050" cy="50" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="1150" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="90" r="1" fill="white" opacity="0.5"/>
  <circle cx="550" cy="75" r="1" fill="white" opacity="0.6"/>
  <circle cx="850" cy="80" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1100" cy="95" r="1" fill="white" opacity="0.5"/>

  <!-- Fires of the Persian camp far background — horizon glow -->
  <ellipse cx="200" cy="330" rx="200" ry="50" fill="#E85020" opacity="0.12"/>
  <ellipse cx="900" cy="320" rx="250" ry="60" fill="#E85020" opacity="0.1"/>
  <ellipse cx="600" cy="340" rx="300" ry="40" fill="#C84010" opacity="0.08"/>

  <!-- Distant Persian torches — sea of lights surrounding -->
  <!-- These are the Persian forces surrounding the hill -->
  <!-- Far ring (small) -->
  <circle cx="80" cy="360" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="150" cy="345" r="2.5" fill="#F0A030" opacity="0.6"/>
  <circle cx="220" cy="340" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="290" cy="348" r="2.5" fill="#F0A030" opacity="0.65"/>
  <circle cx="370" cy="338" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="450" cy="342" r="2.5" fill="#F0A030" opacity="0.6"/>
  <circle cx="530" cy="336" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="620" cy="334" r="2.5" fill="#F0A030" opacity="0.65"/>
  <circle cx="710" cy="338" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="800" cy="342" r="2.5" fill="#F0A030" opacity="0.6"/>
  <circle cx="890" cy="337" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="970" cy="345" r="2.5" fill="#F0A030" opacity="0.65"/>
  <circle cx="1050" cy="352" r="3" fill="#F0A030" opacity="0.7"/>
  <circle cx="1120" cy="358" r="2.5" fill="#F0A030" opacity="0.6"/>
  <circle cx="1180" cy="365" r="3" fill="#F0A030" opacity="0.7"/>
  <!-- Near ring (larger) -->
  <circle cx="50" cy="430" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="130" cy="415" r="3.5" fill="#F0B040" opacity="0.75"/>
  <circle cx="220" cy="408" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="320" cy="404" r="3.5" fill="#F0B040" opacity="0.75"/>
  <circle cx="420" cy="406" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="530" cy="402" r="3.5" fill="#F0B040" opacity="0.75"/>
  <circle cx="650" cy="400" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="780" cy="403" r="3.5" fill="#F0B040" opacity="0.75"/>
  <circle cx="900" cy="406" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="1010" cy="410" r="3.5" fill="#F0B040" opacity="0.75"/>
  <circle cx="1110" cy="418" r="4" fill="#F0A030" opacity="0.8"/>
  <circle cx="1180" cy="426" r="3.5" fill="#F0B040" opacity="0.75"/>

  <!-- Ground and hill -->
  <rect x="0" y="490" width="1200" height="185" fill="#3A2C20"/>
  <rect x="0" y="490" width="1200" height="4" fill="#5A4030" opacity="0.6"/>

  <!-- KOLONOS HILL — the last place -->
  <ellipse cx="600" cy="490" rx="380" ry="80" fill="url(#hill_grad)"/>
  <ellipse cx="600" cy="483" rx="360" ry="68" fill="#4A3828"/>
  <!-- Hill texture / stones -->
  <ellipse cx="480" cy="475" rx="40" ry="12" fill="#5A4830" opacity="0.5"/>
  <ellipse cx="650" cy="470" rx="50" ry="14" fill="#5A4830" opacity="0.4"/>
  <ellipse cx="720" cy="478" rx="35" ry="10" fill="#5A4830" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- THE 300 — last stand on Kolonos Hill           -->
  <!-- Tight back-to-back circle of remaining Spartans -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Torches held by last Spartans — their light -->
  <rect x="520" y="390" width="6" height="70" fill="#8B6020" rx="1"/>
  <ellipse cx="523" cy="388" rx="10" ry="8" fill="#E8A020" opacity="0.9"/>
  <ellipse cx="523" cy="385" rx="7" ry="5" fill="#F0C040" opacity="0.8"/>
  <rect x="680" y="385" width="6" height="70" fill="#8B6020" rx="1"/>
  <ellipse cx="683" cy="383" rx="10" ry="8" fill="#E8A020" opacity="0.9"/>
  <ellipse cx="683" cy="380" rx="7" ry="5" fill="#F0C040" opacity="0.8"/>
  <!-- Torch glow -->
  <ellipse cx="523" cy="405" rx="45" ry="35" fill="url(#torch_glow)"/>
  <ellipse cx="683" cy="400" rx="45" ry="35" fill="url(#torch_glow)"/>

  <!-- SPARTAN FIGURES — back to back, small tight group -->
  <!-- Center figure — Leonidas, facing front -->
  <!-- Shadow cast by torchlight -->
  <ellipse cx="600" cy="490" rx="30" ry="8" fill="#1A1208" opacity="0.5"/>
  <!-- Body armor -->
  <rect x="585" y="428" width="30" height="55" fill="#8B6914" rx="2"/>
  <rect x="587" y="430" width="26" height="51" fill="#C89820" rx="1"/>
  <!-- Crimson cloak -->
  <path d="M 600,428 Q 562,436 558,488" fill="#7A1010" opacity="0.9"/>
  <path d="M 600,428 Q 638,436 642,488" fill="#7A1010" opacity="0.9"/>
  <!-- Legs/greaves -->
  <rect x="588" y="480" width="10" height="45" fill="#B08820" rx="1"/>
  <rect x="601" y="480" width="10" height="45" fill="#B08820" rx="1"/>
  <!-- Head/Helmet — battered, crest still crimson -->
  <ellipse cx="600" cy="410" rx="20" ry="17" fill="#8B6914"/>
  <ellipse cx="600" cy="408" rx="17" ry="14" fill="#A07818"/>
  <!-- Helmet crest — weathered but standing -->
  <rect x="595" y="390" width="10" height="20" fill="#6A0808" rx="1"/>
  <ellipse cx="600" cy="390" rx="13" ry="4" fill="#9A1010"/>
  <!-- Face in shadow but visible -->
  <ellipse cx="600" cy="421" rx="8" ry="7" fill="#B07040"/>
  <circle cx="597" cy="420" r="2.5" fill="#2A1A08"/>
  <circle cx="604" cy="420" r="2.5" fill="#2A1A08"/>
  <!-- Firm set of the jaw -->
  <path d="M 595,426 L 605,426" stroke="#9A5020" stroke-width="1.5"/>
  <!-- Shield — still held -->
  <circle cx="568" cy="462" r="30" fill="#6A4808"/>
  <circle cx="568" cy="462" r="26" fill="#9A7010"/>
  <circle cx="568" cy="462" r="20" fill="#7A5808"/>
  <text x="568" y="469" font-family="Georgia,serif" font-size="20" fill="#D0A820" text-anchor="middle" font-weight="bold">Λ</text>
  <!-- Spear still raised -->
  <line x1="630" y1="365" x2="630" y2="490" stroke="#8B6020" stroke-width="5"/>
  <polygon points="626,365 634,365 630,348" fill="#B0B070"/>

  <!-- SPARTAN 2 — right of Leonidas, facing right -->
  <ellipse cx="650" cy="488" rx="22" ry="6" fill="#1A1208" opacity="0.4"/>
  <rect x="638" y="435" width="26" height="48" fill="#A07818" rx="2"/>
  <path d="M 650,435 Q 672,442 676,487" fill="#7A1010" opacity="0.85"/>
  <rect x="639" y="481" width="9" height="40" fill="#B08820" rx="1"/>
  <rect x="650" y="481" width="9" height="40" fill="#B08820" rx="1"/>
  <ellipse cx="650" cy="420" rx="18" ry="15" fill="#8B6914"/>
  <ellipse cx="650" cy="418" rx="15" ry="13" fill="#A07818"/>
  <rect x="645" y="402" width="9" height="18" fill="#6A0808" rx="1"/>
  <ellipse cx="650" cy="402" rx="11" ry="3.5" fill="#9A1010"/>
  <circle cx="640" cy="462" r="25" fill="#6A4808"/>
  <circle cx="640" cy="462" r="21" fill="#9A7010"/>
  <circle cx="640" cy="462" r="16" fill="#7A5808"/>
  <text x="640" y="468" font-family="Georgia,serif" font-size="17" fill="#D0A820" text-anchor="middle" font-weight="bold">Λ</text>
  <line x1="668" y1="375" x2="668" y2="486" stroke="#8B6020" stroke-width="4"/>
  <polygon points="665,375 671,375 668,360" fill="#B0B070"/>

  <!-- SPARTAN 3 — left of Leonidas, facing left -->
  <ellipse cx="548" cy="488" rx="22" ry="6" fill="#1A1208" opacity="0.4"/>
  <rect x="535" y="435" width="26" height="48" fill="#A07818" rx="2"/>
  <path d="M 548,435 Q 526,442 522,487" fill="#7A1010" opacity="0.85"/>
  <rect x="536" y="481" width="9" height="40" fill="#B08820" rx="1"/>
  <rect x="547" y="481" width="9" height="40" fill="#B08820" rx="1"/>
  <ellipse cx="548" cy="420" rx="18" ry="15" fill="#8B6914"/>
  <ellipse cx="548" cy="418" rx="15" ry="13" fill="#A07818"/>
  <rect x="543" y="402" width="9" height="18" fill="#6A0808" rx="1"/>
  <ellipse cx="548" cy="402" rx="11" ry="3.5" fill="#9A1010"/>
  <circle cx="558" cy="462" r="25" fill="#6A4808"/>
  <circle cx="558" cy="462" r="21" fill="#9A7010"/>
  <circle cx="558" cy="462" r="16" fill="#7A5808"/>
  <text x="558" y="468" font-family="Georgia,serif" font-size="17" fill="#D0A820" text-anchor="middle" font-weight="bold">Λ</text>
  <line x1="530" y1="375" x2="530" y2="486" stroke="#8B6020" stroke-width="4"/>
  <polygon points="527,375 533,375 530,360" fill="#B0B070"/>

  <!-- Arrows struck into ground and hill around them -->
  <line x1="508" y1="470" x2="514" y2="492" stroke="#8B6020" stroke-width="2.5"/>
  <line x1="692" y1="468" x2="686" y2="492" stroke="#8B6020" stroke-width="2.5"/>
  <line x1="545" y1="455" x2="548" y2="478" stroke="#8B6020" stroke-width="2" opacity="0.8"/>
  <line x1="655" y1="457" x2="652" y2="480" stroke="#8B6020" stroke-width="2" opacity="0.8"/>
  <line x1="580" y1="448" x2="583" y2="472" stroke="#8B6020" stroke-width="2" opacity="0.7"/>
  <line x1="622" y1="450" x2="618" y2="473" stroke="#8B6020" stroke-width="2" opacity="0.7"/>
  <!-- Arrows in shields -->
  <line x1="558" y1="448" x2="553" y2="462" stroke="#8B6020" stroke-width="2"/>
  <line x1="625" y1="447" x2="630" y2="462" stroke="#8B6020" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- THE EPITAPH STONE — to the right, torch-lit          -->
  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Stone stele -->
  <rect x="840" y="400" width="100" height="130" fill="#7A7060" rx="4"/>
  <rect x="843" y="402" width="94" height="126" fill="#8A8070" rx="3"/>
  <!-- Stone top rounded -->
  <ellipse cx="890" cy="402" rx="47" ry="15" fill="#8A8070"/>
  <!-- Torch beside stone -->
  <line x1="835" y1="380" x2="835" y2="460" stroke="#8B6020" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="835" cy="378" rx="8" ry="6" fill="#E8A020" opacity="0.9"/>
  <ellipse cx="835" cy="376" rx="5" ry="4" fill="#F0C040" opacity="0.8"/>
  <!-- Torch glow illuminating stone -->
  <ellipse cx="862" cy="430" rx="65" ry="55" fill="#F0A030" opacity="0.1"/>
  <!-- Greek text incised in stone -->
  <text x="890" y="432" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#D8C8A0" text-anchor="middle" font-style="italic" opacity="0.9">Go, tell the</text>
  <text x="890" y="447" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#D8C8A0" text-anchor="middle" font-style="italic" opacity="0.9">Spartans,</text>
  <text x="890" y="462" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#D8C8A0" text-anchor="middle" font-style="italic" opacity="0.9">stranger</text>
  <text x="890" y="477" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#D8C8A0" text-anchor="middle" font-style="italic" opacity="0.9">passing by...</text>
  <!-- Stone base -->
  <rect x="830" y="528" width="120" height="16" fill="#6A6050" rx="2"/>

  <!-- Persian silhouettes closing in — dark figures in background -->
  <!-- Left side -->
  <rect x="180" y="415" width="20" height="70" fill="#2A1A10" opacity="0.7"/>
  <ellipse cx="190" cy="412" rx="12" ry="12" fill="#2A1A10" opacity="0.7"/>
  <line x1="190" y1="380" x2="190" y2="420" stroke="#4A3010" stroke-width="3" opacity="0.7"/>
  <polygon points="187,380 193,380 190,365" fill="#8A6820" opacity="0.7"/>
  <rect x="240" y="420" width="18" height="65" fill="#2A1A10" opacity="0.65"/>
  <ellipse cx="249" cy="417" rx="11" ry="11" fill="#2A1A10" opacity="0.65"/>
  <rect x="295" y="418" width="20" height="67" fill="#2A1A10" opacity="0.7"/>
  <ellipse cx="305" cy="415" rx="12" ry="12" fill="#2A1A10" opacity="0.7"/>
  <line x1="305" y1="382" x2="305" y2="418" stroke="#4A3010" stroke-width="3" opacity="0.7"/>

  <!-- Right side Persian silhouettes -->
  <rect x="860" y="415" width="20" height="70" fill="#2A1A10" opacity="0.7"/>
  <ellipse cx="870" cy="412" rx="12" ry="12" fill="#2A1A10" opacity="0.7"/>
  <line x1="870" y1="380" x2="870" y2="420" stroke="#4A3010" stroke-width="3" opacity="0.7"/>
  <rect x="910" y="418" width="18" height="68" fill="#2A1A10" opacity="0.65"/>
  <ellipse cx="919" cy="415" rx="11" ry="11" fill="#2A1A10" opacity="0.65"/>
  <rect x="960" y="415" width="20" height="70" fill="#2A1A10" opacity="0.7"/>
  <ellipse cx="970" cy="412" rx="12" ry="12" fill="#2A1A10" opacity="0.7"/>
  <line x1="970" y1="380" x2="970" y2="420" stroke="#4A3010" stroke-width="3" opacity="0.7"/>
  <polygon points="967,380 973,380 970,365" fill="#8A6820" opacity="0.7"/>
  <rect x="1010" y="418" width="18" height="68" fill="#2A1A10" opacity="0.65"/>
  <ellipse cx="1019" cy="415" rx="11" ry="11" fill="#2A1A10" opacity="0.65"/>

  <!-- Dilios watching from the distance — small figure on cliff edge, left -->
  <!-- He was sent away to tell the story -->
  <rect x="118" y="330" width="10" height="38" fill="#4A6888" opacity="0.8"/>
  <ellipse cx="123" cy="327" rx="8" ry="9" fill="#4A6888" opacity="0.8"/>
  <!-- His cloak billowing -->
  <path d="M 118,340 Q 105,345 100,368" fill="#3A5878" opacity="0.7"/>
  <!-- His hand raised — witnessing -->
  <line x1="118" y1="342" x2="108" y2="334" stroke="#4A6888" stroke-width="4" opacity="0.7"/>
  <ellipse cx="106" cy="332" rx="5" ry="4" fill="#4A6888" opacity="0.7"/>

  <!-- Label -->
  <text x="60" y="655" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#D0C8B0" opacity="0.75" font-style="italic">Kolonos Hill · The Last Stand · Thermopylae · 480 BC</text>
</svg>
