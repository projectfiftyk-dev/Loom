  <ellipse cx="60" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="130" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="130" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="200" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="200" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="270" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="270" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="340" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="340" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="410" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="410" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="480" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="480" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="550" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="550" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="620" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="620" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="690" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="690" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="760" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="760" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="830" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="830" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="900" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="900" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="970" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="970" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="1040" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="1040" cy="397" rx="8" ry="8" fill="#C89048"/>
  <ellipse cx="1110" cy="407" rx="14" ry="12" fill="#B07030"/>
  <ellipse cx="1110" cy="396" rx="8" ry="8" fill="#C88840"/>
  <ellipse cx="1170" cy="408" rx="14" ry="12" fill="#B87840"/>
  <ellipse cx="1170" cy="397" rx="8" ry="8" fill="#C89048"/>

  <!-- Persian shields — wicker/painted, oval or rectangular -->
  <ellipse cx="60" cy="418" rx="18" ry="12" fill="#6A4828" opacity="0.8"/>
  <ellipse cx="130" cy="417" rx="18" ry="12" fill="#7A5830" opacity="0.8"/>
  <ellipse cx="200" cy="418" rx="18" ry="12" fill="#6A4828" opacity="0.8"/>
  <ellipse cx="340" cy="418" rx="18" ry="12" fill="#7A5830" opacity="0.8"/>
  <ellipse cx="480" cy="418" rx="18" ry="12" fill="#6A4828" opacity="0.8"/>
  <ellipse cx="620" cy="417" rx="18" ry="12" fill="#7A5830" opacity="0.8"/>
  <ellipse cx="760" cy="418" rx="18" ry="12" fill="#6A4828" opacity="0.8"/>
  <ellipse cx="900" cy="417" rx="18" ry="12" fill="#7A5830" opacity="0.8"/>
  <ellipse cx="1040" cy="418" rx="18" ry="12" fill="#6A4828" opacity="0.8"/>
  <ellipse cx="1170" cy="418" rx="18" ry="12" fill="#7A5830" opacity="0.8"/>

  <!-- Front rank spears -->
