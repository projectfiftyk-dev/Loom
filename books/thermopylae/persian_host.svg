  <ellipse cx="75" cy="380" rx="8" ry="7" fill="#9A6830"/>
  <ellipse cx="145" cy="378" rx="8" ry="7" fill="#9A6830"/>
  <ellipse cx="215" cy="380" rx="8" ry="7" fill="#8A5828"/>
  <ellipse cx="285" cy="378" rx="8" ry="7" fill="#9A6830"/>
