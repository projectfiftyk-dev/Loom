  <line x1="650" y1="315" x2="650" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="700" y1="313" x2="700" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="750" y1="314" x2="750" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="800" y1="312" x2="800" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="850" y1="315" x2="850" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="900" y1="313" x2="900" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="950" y1="314" x2="950" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="1000" y1="312" x2="1000" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="1050" y1="315" x2="1050" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="1100" y1="313" x2="1100" y2="330" stroke="#C0B880" stroke-width="2"/>
