  <line x1="130" y1="358" x2="130" y2="415" stroke="#C0A050" stroke-width="3.5"/>
  <line x1="200" y1="360" x2="200" y2="415" stroke="#C0A050" stroke-width="3.5"/>
  <line x1="340" y1="358" x2="340" y2="415" stroke="#C0A050" stroke-width="3.5"/>
