  <line x1="1100" y1="295" x2="1100" y2="308" stroke="#8B4A14" stroke-width="2"/>
  <rect x="1100" y="293" width="12" height="6" fill="#6A40A0"/>

  <!-- MIDDLE DISTANCE ROWS — slightly larger figures -->
  <!-- Row 1 at ~330 -->
  <rect x="0" y="328" width="1200" height="18" fill="#6A4020" opacity="0.75"/>
  <!-- Persian spear tips row 1 -->
  <line x1="50" y1="315" x2="50" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="100" y1="313" x2="100" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="150" y1="315" x2="150" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="200" y1="312" x2="200" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="250" y1="315" x2="250" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="300" y1="313" x2="300" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="350" y1="314" x2="350" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="400" y1="312" x2="400" y2="330" stroke="#C0B880" stroke-width="2"/>
  <line x1="450" y1="315" x2="450" y2="330" stroke="#C0B880" stroke-width="2"/>
