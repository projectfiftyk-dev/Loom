<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="persian_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3020"/>
      <stop offset="30%" stop-color="#8A5020"/>
      <stop offset="60%" stop-color="#C87820"/>
      <stop offset="100%" stop-color="#E8A830"/>
    </linearGradient>
    <linearGradient id="persian_plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A8858"/>
      <stop offset="100%" stop-color="#7A6840"/>
    </linearGradient>
    <radialGradient id="sun_haze" cx="60%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#F0C060" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F0C060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Harsh eastern sky — dust haze from the vast army -->
  <rect width="1200" height="675" fill="url(#persian_sky)"/>
  <rect width="1200" height="675" fill="url(#sun_haze)"/>

  <!-- Dust haze from the army filling the horizon -->
  <rect x="0" y="200" width="1200" height="200" fill="#C89040" opacity="0.12"/>
  <ellipse cx="600" cy="310" rx="800" ry="120" fill="#C88020" opacity="0.08"/>

  <!-- Ground — the plain before the pass -->
  <rect x="0" y="430" width="1200" height="245" fill="url(#persian_plain)"/>
  <rect x="0" y="430" width="1200" height="5" fill="#B0A060" opacity="0.5"/>

