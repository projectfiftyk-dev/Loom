  <!-- THE PERSIAN HOST — rows upon rows stretching to the horizon            -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->

  <!-- DISTANT MASS (horizon) — just a dark band of figures -->
  <rect x="0" y="305" width="1200" height="12" fill="#5A3A18" opacity="0.8"/>
  <!-- Tiny banners at horizon -->
  <line x1="80" y1="295" x2="80" y2="307" stroke="#8B4A14" stroke-width="2"/>
  <rect x="80" y="293" width="12" height="6" fill="#C89020"/>
  <line x1="200" y1="295" x2="200" y2="307" stroke="#8B4A14" stroke-width="2"/>
  <rect x="200" y="293" width="12" height="6" fill="#C83020"/>
  <line x1="340" y1="294" x2="340" y2="307" stroke="#8B4A14" stroke-width="2"/>
  <rect x="340" y="292" width="12" height="6" fill="#C89020"/>
  <line x1="500" y1="295" x2="500" y2="308" stroke="#8B4A14" stroke-width="2"/>
  <rect x="500" y="293" width="12" height="6" fill="#6A40A0"/>
  <line x1="680" y1="294" x2="680" y2="307" stroke="#8B4A14" stroke-width="2"/>
  <rect x="680" y="292" width="12" height="6" fill="#C89020"/>
  <line x1="820" y1="295" x2="820" y2="308" stroke="#8B4A14" stroke-width="2"/>
  <rect x="820" y="293" width="12" height="6" fill="#C83020"/>
  <line x1="960" y1="294" x2="960" y2="307" stroke="#8B4A14" stroke-width="2"/>
