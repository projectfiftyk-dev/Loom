  <!-- ════════════════════════════════════════════════════════ -->
  <!-- XERXES' GOLDEN THRONE — hilltop right, overlooking all -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- Hill -->
  <ellipse cx="1050" cy="430" rx="180" ry="70" fill="#8A7848" opacity="0.6"/>
  <!-- Platform -->
  <rect x="970" y="365" width="160" height="20" fill="#C89820" rx="3"/>
  <rect x="972" y="362" width="156" height="8" fill="#E0B030" rx="2"/>
  <!-- Throne back -->
  <rect x="1020" y="320" width="60" height="50" fill="#C89820" rx="5"/>
  <rect x="1024" y="323" width="52" height="44" fill="#E0B030" rx="3"/>
  <!-- Throne decorations -->
  <line x1="1020" y1="323" x2="1020" y2="370" stroke="#8B6010" stroke-width="3"/>
  <line x1="1080" y1="323" x2="1080" y2="370" stroke="#8B6010" stroke-width="3"/>
  <!-- Xerxes figure on throne -->
  <ellipse cx="1050" cy="340" rx="16" ry="14" fill="#C89048"/>
  <!-- Crown -->
  <rect x="1039" y="322" width="22" height="12" fill="#E0B030" rx="2"/>
  <path d="M 1039,322 L 1044,314 L 1050,320 L 1056,314 L 1061,322" fill="#E0B030" stroke="#C89020" stroke-width="1"/>
  <!-- His face watching the battle -->
  <circle cx="1050" cy="340" r="9" fill="#C89048"/>
  <circle cx="1046" cy="338" r="2" fill="#3A1A08"/>
  <circle cx="1054" cy="338" r="2" fill="#3A1A08"/>
  <!-- Royal purple cloak -->
  <path d="M 1035,350 Q 1010,360 1005,380" fill="#6A3088" opacity="0.85"/>
  <path d="M 1065,350 Q 1090,360 1095,380" fill="#6A3088" opacity="0.85"/>
  <!-- Throne steps -->
  <rect x="975" y="382" width="150" height="5" fill="#B08820"/>
  <rect x="980" y="387" width="140" height="5" fill="#A07818"/>
  <!-- Guard figures flanking throne -->
  <rect x="980" y="335" width="16" height="50" fill="#8B6018" opacity="0.8"/>
  <ellipse cx="988" cy="332" rx="9" ry="9" fill="#C89048" opacity="0.8"/>
  <line x1="988" y1="305" x2="988" y2="360" stroke="#C0A050" stroke-width="3" opacity="0.8"/>
  <rect x="1104" y="335" width="16" height="50" fill="#8B6018" opacity="0.8"/>
  <ellipse cx="1112" cy="332" rx="9" ry="9" fill="#C89048" opacity="0.8"/>
  <line x1="1112" y1="305" x2="1112" y2="360" stroke="#C0A050" stroke-width="3" opacity="0.8"/>

  <!-- Persian elephants — dark shapes far left -->
  <ellipse cx="80" cy="370" rx="55" ry="35" fill="#3A2818" opacity="0.6"/>
  <ellipse cx="80" cy="355" rx="40" ry="25" fill="#4A3820" opacity="0.6"/>
  <!-- Trunk -->
  <path d="M 45,368 Q 38,380 42,392" fill="none" stroke="#3A2818" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Tusks -->
  <path d="M 48,370 Q 35,372 30,368" fill="none" stroke="#D0C8A0" stroke-width="3" opacity="0.6"/>
  <ellipse cx="80" cy="400" rx="60" ry="18" fill="#3A2818" opacity="0.5"/>

  <!-- Great banner of Persia — center background -->
  <line x1="580" y1="200" x2="580" y2="340" stroke="#8B6018" stroke-width="6"/>
  <rect x="580" y="200" width="80" height="55" fill="#C89020" opacity="0.9"/>
  <ellipse cx="620" cy="227" rx="25" ry="20" fill="#8B4A10" opacity="0.7"/>
  <line x1="580" y1="200" x2="660" y2="200" stroke="#8B6018" stroke-width="4"/>
  <!-- Ahura Mazda symbol on banner -->
  <circle cx="620" cy="228" r="10" fill="#E0C040" opacity="0.8"/>
  <path d="M 605,215 Q 620,210 635,215" fill="none" stroke="#E0C040" stroke-width="2" opacity="0.7"/>
  <path d="M 605,240 Q 620,245 635,240" fill="none" stroke="#E0C040" stroke-width="2" opacity="0.7"/>

  <!-- Dust clouds from the vast army -->
  <ellipse cx="300" cy="320" rx="200" ry="40" fill="#C8A060" opacity="0.1"/>
  <ellipse cx="900" cy="310" rx="250" ry="50" fill="#C8A060" opacity="0.08"/>

  <!-- Label -->
  <text x="60" y="655" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#F0D890" opacity="0.7" font-style="italic">The Host of Xerxes · 200,000 strong · 480 BC</text>
</svg>
