  <line x1="1170" y1="358" x2="1170" y2="415" stroke="#C0A050" stroke-width="3.5"/>
  <!-- Spear tips gold -->
  <polygon points="57,360 63,360 60,345" fill="#D0B840"/>
  <polygon points="127,358 133,358 130,343" fill="#D0B840"/>
  <polygon points="197,360 203,360 200,345" fill="#D0B840"/>
  <polygon points="337,358 343,358 340,343" fill="#D0B840"/>
  <polygon points="477,360 483,360 480,345" fill="#D0B840"/>
