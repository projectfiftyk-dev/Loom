<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="pass_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A5A"/>
      <stop offset="40%" stop-color="#5A6A78"/>
      <stop offset="100%" stop-color="#8A9AA8"/>
    </linearGradient>
    <linearGradient id="cliff_left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A2828"/>
      <stop offset="100%" stop-color="#4A4440"/>
    </linearGradient>
    <linearGradient id="sea_right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5A7A"/>
      <stop offset="100%" stop-color="#1A3A5A"/>
    </linearGradient>
    <linearGradient id="pass_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A7858"/>
      <stop offset="100%" stop-color="#6A5A40"/>
    </linearGradient>
  </defs>

  <!-- Overcast dramatic sky -->
  <rect width="1200" height="675" fill="url(#pass_sky)"/>
  <!-- Heavy storm clouds pressing in -->
  <ellipse cx="400" cy="60" rx="300" ry="80" fill="#2A3040" opacity="0.7"/>
  <ellipse cx="700" cy="40" rx="350" ry="90" fill="#303848" opacity="0.7"/>
  <ellipse cx="1050" cy="70" rx="250" ry="70" fill="#2A3040" opacity="0.6"/>
  <ellipse cx="200" cy="80" rx="200" ry="60" fill="#383E48" opacity="0.6"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- CLIFF FACE — left half, massive, sheer       -->
  <!-- ════════════════════════════════════════════ -->
  <rect x="0" y="0" width="420" height="675" fill="url(#cliff_left)"/>
  <!-- Cliff face details — striations, cracks -->
  <path d="M 0,80 Q 50,90 120,75 Q 200,60 280,85 Q 360,100 420,88" fill="none" stroke="#3A3530" stroke-width="3" opacity="0.5"/>
  <path d="M 0,180 Q 80,165 160,185 Q 250,200 340,175 Q 390,165 420,180" fill="none" stroke="#3A3530" stroke-width="2" opacity="0.4"/>
  <path d="M 0,300 Q 60,285 140,305 Q 220,320 300,295 Q 370,278 420,295" fill="none" stroke="#3A3530" stroke-width="2" opacity="0.4"/>
  <!-- Vertical fault lines in cliff -->
  <path d="M 120,0 Q 118,150 125,300 Q 122,450 120,675" fill="none" stroke="#252020" stroke-width="3" opacity="0.4"/>
  <path d="M 250,0 Q 248,200 255,350 Q 252,500 250,675" fill="none" stroke="#252020" stroke-width="2" opacity="0.3"/>
  <path d="M 360,0 Q 358,180 365,380 Q 362,520 360,675" fill="none" stroke="#252020" stroke-width="2" opacity="0.3"/>
  <!-- Rock face shading — darker near the pass -->
  <rect x="350" y="0" width="70" height="675" fill="#1A1818" opacity="0.5"/>
  <!-- Sulfur springs at base — the "hot gates" -->
  <ellipse cx="380" cy="620" rx="25" ry="12" fill="#D8C830" opacity="0.4"/>
  <ellipse cx="395" cy="632" rx="18" ry="8" fill="#E0D840" opacity="0.3"/>
  <path d="M 375,608 Q 380,598 378,590" fill="none" stroke="#A0A030" stroke-width="2" opacity="0.4"/>
  <path d="M 390,610 Q 396,600 393,592" fill="none" stroke="#A0A030" stroke-width="2" opacity="0.3"/>

  <!-- ════════════════════════════════════════ -->
  <!-- MALIAN GULF — right side, grey sea      -->
  <!-- ════════════════════════════════════════ -->
  <rect x="820" y="0" width="380" height="675" fill="url(#sea_right)"/>
  <!-- Sea surface — light catching on waves -->
  <path d="M 820,150 Q 900,142 1000,152 Q 1100,162 1200,148" fill="none" stroke="#8AAABB" stroke-width="2" opacity="0.4"/>
  <path d="M 820,220 Q 920,210 1020,222 Q 1120,232 1200,218" fill="none" stroke="#8AAABB" stroke-width="1.5" opacity="0.35"/>
  <path d="M 820,310 Q 900,300 1000,312 Q 1100,322 1200,308" fill="none" stroke="#8AAABB" stroke-width="1.5" opacity="0.3"/>
  <path d="M 820,400 Q 920,390 1020,402 Q 1120,412 1200,398" fill="none" stroke="#8AAABB" stroke-width="1.5" opacity="0.25"/>
  <!-- Coastal rocks where cliff meets sea -->
  <ellipse cx="830" cy="600" rx="30" ry="15" fill="#3A3830" opacity="0.7"/>
  <ellipse cx="855" cy="615" rx="22" ry="10" fill="#3A3830" opacity="0.6"/>
  <ellipse cx="875" cy="605" rx="18" ry="8" fill="#3A3830" opacity="0.7"/>
  <!-- Darker where cliff shadow falls on sea -->
  <rect x="820" y="0" width="60" height="675" fill="#1A2A3A" opacity="0.4"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- THE PASS — narrow dirt track between cliff and sea  -->
  <!-- ════════════════════════════════════════════════════ -->
  <rect x="420" y="420" width="400" height="255" fill="url(#pass_floor)"/>
  <rect x="420" y="420" width="400" height="5" fill="#A09070" opacity="0.6"/>

  <!-- Pass floor — dusty, worn stones, ruts of ancient carts -->
  <path d="M 480,430 Q 550,428 620,432 Q 700,435 780,430" fill="none" stroke="#706050" stroke-width="2" opacity="0.4"/>
  <path d="M 460,480 Q 540,476 640,481 Q 720,485 800,478" fill="none" stroke="#706050" stroke-width="1.5" opacity="0.3"/>
  <!-- Ancient flat stones embedded in pass floor -->
  <rect x="450" y="450" width="40" height="18" fill="#9A8870" rx="2" opacity="0.5"/>
  <rect x="530" y="460" width="35" height="16" fill="#9A8870" rx="2" opacity="0.5"/>
  <rect x="680" y="448" width="38" height="17" fill="#9A8870" rx="2" opacity="0.5"/>
  <rect x="750" y="462" width="30" height="15" fill="#9A8870" rx="2" opacity="0.5"/>

  <!-- ════════════════════════════════════════════════════ -->
  <!-- THE PHOCIAN WALL — rebuilt across the pass          -->
  <!-- ════════════════════════════════════════════════════ -->
  <rect x="420" y="350" width="400" height="75" fill="#8A7858"/>
  <rect x="420" y="345" width="400" height="12" fill="#9A8868" opacity="0.9"/>
  <!-- Stone courses / texture on wall -->
  <path d="M 420,365 L 820,365" stroke="#6A5840" stroke-width="2" opacity="0.5"/>
  <path d="M 420,382 L 820,382" stroke="#6A5840" stroke-width="2" opacity="0.5"/>
  <path d="M 420,398 L 820,398" stroke="#6A5840" stroke-width="2" opacity="0.5"/>
  <!-- Vertical joints (staggered like masonry) -->
  <line x1="470" y1="345" x2="470" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="520" y1="353" x2="520" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="570" y1="345" x2="570" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="620" y1="353" x2="620" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="670" y1="345" x2="670" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="720" y1="353" x2="720" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>
  <line x1="770" y1="345" x2="770" y2="425" stroke="#6A5840" stroke-width="1.5" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SPARTAN PHALANX — defending the wall, seen from front  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Row of overlapping shields — the Wall of Bronze -->
  <!-- Shield row 1 (frontmost) - large, overlapping -->
  <circle cx="448" cy="345" r="30" fill="#8B6914"/>
  <circle cx="448" cy="345" r="26" fill="#C89820"/>
  <circle cx="448" cy="345" r="20" fill="#A07810"/>
  <text x="448" y="351" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="500" cy="342" r="30" fill="#8B6914"/>
  <circle cx="500" cy="342" r="26" fill="#C89820"/>
  <circle cx="500" cy="342" r="20" fill="#A07810"/>
  <text x="500" y="348" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="552" cy="340" r="30" fill="#8B6914"/>
  <circle cx="552" cy="340" r="26" fill="#C89820"/>
  <circle cx="552" cy="340" r="20" fill="#A07810"/>
  <text x="552" y="346" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="604" cy="340" r="30" fill="#8B6914"/>
  <circle cx="604" cy="340" r="26" fill="#C89820"/>
  <circle cx="604" cy="340" r="20" fill="#A07810"/>
  <text x="604" y="346" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="656" cy="341" r="30" fill="#8B6914"/>
  <circle cx="656" cy="341" r="26" fill="#C89820"/>
  <circle cx="656" cy="341" r="20" fill="#A07810"/>
  <text x="656" y="347" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="708" cy="342" r="30" fill="#8B6914"/>
  <circle cx="708" cy="342" r="26" fill="#C89820"/>
  <circle cx="708" cy="342" r="20" fill="#A07810"/>
  <text x="708" y="348" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <circle cx="760" cy="343" r="30" fill="#8B6914"/>
  <circle cx="760" cy="343" r="26" fill="#C89820"/>
  <circle cx="760" cy="343" r="20" fill="#A07810"/>
  <text x="760" y="349" font-family="Georgia,serif" font-size="18" fill="#E8D060" text-anchor="middle" font-weight="bold">Λ</text>

  <!-- Helmet crests above shield row — crimson plumes -->
  <rect x="442" y="290" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="446" cy="290" rx="9" ry="4" fill="#C82020"/>
  <rect x="494" y="288" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="498" cy="288" rx="9" ry="4" fill="#C82020"/>
  <rect x="546" y="287" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="550" cy="287" rx="9" ry="4" fill="#C82020"/>
  <rect x="598" y="286" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="602" cy="286" rx="9" ry="4" fill="#C82020"/>
  <rect x="650" y="287" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="654" cy="287" rx="9" ry="4" fill="#C82020"/>
  <rect x="702" y="288" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="706" cy="288" rx="9" ry="4" fill="#C82020"/>
  <rect x="754" y="289" width="7" height="20" fill="#8B1A1A" rx="1"/>
  <ellipse cx="758" cy="289" rx="9" ry="4" fill="#C82020"/>

  <!-- Spears projecting forward over shields -->
  <line x1="446" y1="270" x2="446" y2="430" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="498" y1="268" x2="498" y2="428" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="550" y1="266" x2="550" y2="426" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="602" y1="265" x2="602" y2="425" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="654" y1="266" x2="654" y2="426" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="706" y1="268" x2="706" y2="428" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <line x1="758" y1="268" x2="758" y2="428" stroke="#8B6020" stroke-width="4" opacity="0.9"/>
  <!-- Spear tips bronze -->
  <polygon points="443,270 449,270 446,255" fill="#C0C0A0"/>
  <polygon points="495,268 501,268 498,253" fill="#C0C0A0"/>
  <polygon points="547,266 553,266 550,251" fill="#C0C0A0"/>
  <polygon points="599,265 605,265 602,250" fill="#C0C0A0"/>
  <polygon points="651,266 657,266 654,251" fill="#C0C0A0"/>
  <polygon points="703,268 709,268 706,253" fill="#C0C0A0"/>
  <polygon points="755,268 761,268 758,253" fill="#C0C0A0"/>

  <!-- Mist / distance beyond the wall -->
  <rect x="420" y="320" width="400" height="30" fill="#9A9898" opacity="0.2"/>

  <!-- "15 METERS" annotation -->
  <line x1="420" y1="590" x2="420" y2="570" stroke="#F0E0A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="820" y1="590" x2="820" y2="570" stroke="#F0E0A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="420" y1="580" x2="820" y2="580" stroke="#F0E0A0" stroke-width="1.5" opacity="0.5"/>
  <text x="620" y="575" font-family="Georgia,serif" font-size="14" fill="#F0E0A0" text-anchor="middle" opacity="0.7" font-style="italic">~15 meters — the Middle Gate</text>

  <!-- Label -->
  <text x="60" y="652" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#D0D8E0" opacity="0.7" font-style="italic">Thermopylae · The Hot Gates · 480 BC</text>
</svg>
