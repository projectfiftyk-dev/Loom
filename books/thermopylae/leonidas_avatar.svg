<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Background — deep crimson -->
  <circle cx="60" cy="60" r="58" fill="#8B1A1A"/>
  <circle cx="60" cy="60" r="55" fill="#A02020"/>

  <!-- Corinthian helmet — bronze -->
  <!-- Helmet body -->
  <ellipse cx="60" cy="38" rx="34" ry="28" fill="#8B6914"/>
  <ellipse cx="60" cy="36" rx="30" ry="25" fill="#C89820"/>
  <!-- Nasal guard -->
  <rect x="56" y="42" width="8" height="22" fill="#A07818" rx="2"/>
  <!-- Cheek guards -->
  <path d="M 30,42 Q 28,60 35,72 Q 40,68 42,58 Q 38,52 35,42 Z" fill="#B08820"/>
  <path d="M 90,42 Q 92,60 85,72 Q 80,68 78,58 Q 82,52 85,42 Z" fill="#B08820"/>
  <!-- Helmet crest - horsehair in crimson -->
  <rect x="55" y="10" width="10" height="28" fill="#8B1A1A" rx="3"/>
  <ellipse cx="60" cy="10" rx="12" ry="6" fill="#C02020"/>
  <!-- Helmet brow ridge -->
  <path d="M 28,44 Q 60,35 92,44" fill="none" stroke="#D0A830" stroke-width="3"/>

  <!-- Face — weathered, strong -->
  <!-- Skin -->
  <ellipse cx="60" cy="72" rx="22" ry="20" fill="#C8855A"/>
  <!-- Eyes — intense, narrowed -->
  <!-- Eye whites just visible under helmet shadows -->
  <ellipse cx="52" cy="66" rx="6" ry="4" fill="#E8D8C0"/>
  <ellipse cx="68" cy="66" rx="6" ry="4" fill="#E8D8C0"/>
  <circle cx="52" cy="66" r="3" fill="#3A1A08"/>
  <circle cx="68" cy="66" r="3" fill="#3A1A08"/>
  <circle cx="53" cy="65" r="1" fill="white" opacity="0.7"/>
  <circle cx="69" cy="65" r="1" fill="white" opacity="0.7"/>
  <!-- Strong brow line -->
  <path d="M 45,62 Q 52,59 59,62" fill="none" stroke="#8B5A30" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 61,62 Q 68,59 75,62" fill="none" stroke="#8B5A30" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M 58,68 Q 57,74 60,76 Q 63,74 62,68" fill="#B87050" stroke="#A06040" stroke-width="1"/>
  <!-- Mouth — firm, determined -->
  <path d="M 53,82 L 67,82" stroke="#9A5840" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Jaw / beard hint -->
  <path d="M 40,78 Q 60,90 80,78" fill="#9A6840" opacity="0.4"/>
  <!-- Battle scar on cheek -->
  <path d="M 72,68 Q 75,73 73,78" fill="none" stroke="#8B4030" stroke-width="1.5" opacity="0.6"/>

  <!-- Cloak strap / armor visible at bottom -->
  <rect x="32" y="95" width="56" height="18" fill="#8B1A1A" rx="3"/>
  <path d="M 32,95 Q 60,90 88,95" fill="#C02020" opacity="0.7"/>
  <!-- Bronze shoulder piece -->
  <ellipse cx="38" cy="97" rx="10" ry="6" fill="#B08820" opacity="0.8"/>
  <ellipse cx="82" cy="97" rx="10" ry="6" fill="#B08820" opacity="0.8"/>
</svg>
