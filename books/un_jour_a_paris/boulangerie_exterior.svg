  <rect x="602" y="398" width="70"  height="80" fill="#3A5A7A" opacity="0.5" rx="2"/>
  <text x="600" y="488" font-family="serif" font-size="13" fill="#C8A840" text-anchor="middle">ENTREZ</text>
