  <path d="M 130,260 L 1070,260 L 1040,320 L 160,320 Z" fill="none" stroke="#C8A840" stroke-width="3"/>
  <!-- Awning scalloped edge -->
  <path d="M 160,320 Q175,338 190,320 Q205,338 220,320 Q235,338 250,320 Q265,338 280,320 Q295,338 310,320 Q325,338 340,320 Q355,338 370,320 Q385,338 400,320 Q415,338 430,320 Q445,338 460,320 Q475,338 490,320 Q505,338 520,320 Q535,338 550,320 Q565,338 580,320 Q595,338 610,320 Q625,338 640,320 Q655,338 670,320 Q685,338 700,320 Q715,338 730,320 Q745,338 760,320 Q775,338 790,320 Q805,338 820,320 Q835,338 850,320 Q865,338 880,320 Q895,338 910,320 Q925,338 940,320 Q955,338 970,320 Q985,338 1000,320 Q1015,338 1030,320 Q1040,320 1040,320" fill="#1A2A4A" stroke="#C8A840" stroke-width="2"/>
