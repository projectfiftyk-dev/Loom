  <ellipse cx="420" cy="475" rx="45" ry="22" fill="#C88A30"/>
  <text x="420" y="480" font-family="serif" font-size="11" fill="#6A3808" text-anchor="middle" opacity="0.7">baguette</text>
  <ellipse cx="540" cy="480" rx="32" ry="28" fill="#C8A050" opacity="0.9"/>
  <ellipse cx="540" cy="466" rx="25" ry="20" fill="#E8C060"/>
  <ellipse cx="660" cy="485" rx="38" ry="25" fill="#B87828" opacity="0.9"/>
