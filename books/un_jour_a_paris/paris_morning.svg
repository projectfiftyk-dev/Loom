<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A4A"/>
      <stop offset="40%" stop-color="#8B4A6A"/>
      <stop offset="100%" stop-color="#E8A85A"/>
    </linearGradient>
    <linearGradient id="seine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6A8A"/>
      <stop offset="100%" stop-color="#2A4A6A"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#dawn)"/>
  <!-- Moon/early sun glow -->
  <ellipse cx="820" cy="130" rx="160" ry="100" fill="#F0A040" opacity="0.15"/>
  <circle cx="820" cy="130" r="42" fill="#F5C060" opacity="0.7"/>
  <!-- Eiffel Tower silhouette -->
  <polygon points="570,80 590,80 620,420 540,420" fill="#1A1810" opacity="0.9"/>
  <polygon points="560,420 630,420 650,470 540,470" fill="#1A1810" opacity="0.9"/>
  <rect x="545" y="470" width="100" height="20" fill="#1A1810" opacity="0.9"/>
  <!-- Tower legs -->
  <polygon points="570,80 540,420 520,420 555,80" fill="#1A1810" opacity="0.9"/>
  <polygon points="590,80 625,80 660,420 640,420" fill="#1A1810" opacity="0.9"/>
  <!-- Tower crossbars -->
  <rect x="525" y="220" width="140" height="8" fill="#1A1810" opacity="0.9"/>
  <rect x="535" y="320" width="120" height="7" fill="#1A1810" opacity="0.9"/>
  <!-- City skyline -->
  <rect x="0"    y="370" width="100" height="200" fill="#1A1810" opacity="0.85"/>
  <rect x="95"   y="340" width="80"  height="230" fill="#221F15" opacity="0.85"/>
  <rect x="170"  y="380" width="120" height="190" fill="#1A1810" opacity="0.85"/>
  <rect x="285"  y="350" width="70"  height="220" fill="#221F15" opacity="0.85"/>
  <rect x="350"  y="390" width="95"  height="180" fill="#1A1810" opacity="0.85"/>
  <rect x="440"  y="360" width="60"  height="210" fill="#221F15" opacity="0.85"/>
  <rect x="700"  y="355" width="90"  height="215" fill="#221F15" opacity="0.85"/>
  <rect x="785"  y="375" width="110" height="195" fill="#1A1810" opacity="0.85"/>
  <rect x="890"  y="345" width="75"  height="225" fill="#221F15" opacity="0.85"/>
  <rect x="960"  y="370" width="100" height="200" fill="#1A1810" opacity="0.85"/>
  <rect x="1055" y="360" width="80"  height="210" fill="#221F15" opacity="0.85"/>
  <rect x="1130" y="385" width="70"  height="190" fill="#1A1810" opacity="0.85"/>
  <!-- Seine river -->
  <rect x="0" y="490" width="1200" height="60" fill="url(#seine)" opacity="0.7"/>
  <!-- River reflections -->
  <ellipse cx="580" cy="515" rx="40" ry="6" fill="#F5C060" opacity="0.2"/>
  <ellipse cx="820" cy="518" rx="55" ry="5" fill="#F5C060" opacity="0.15"/>
  <!-- Street/quai -->
  <rect x="0" y="545" width="1200" height="130" fill="#2A2418"/>
  <rect x="0" y="545" width="1200" height="4" fill="#4A4030" opacity="0.7"/>
  <!-- Street lamps -->
  <line x1="200" y1="545" x2="200" y2="460" stroke="#4A4030" stroke-width="3"/>
  <circle cx="200" cy="455" r="8" fill="#F5D870" opacity="0.8"/>
  <ellipse cx="200" cy="460" rx="25" ry="10" fill="#F5D870" opacity="0.1"/>
  <line x1="600" y1="545" x2="600" y2="460" stroke="#4A4030" stroke-width="3"/>
  <circle cx="600" cy="455" r="8" fill="#F5D870" opacity="0.8"/>
  <line x1="1000" y1="545" x2="1000" y2="460" stroke="#4A4030" stroke-width="3"/>
  <circle cx="1000" cy="455" r="8" fill="#F5D870" opacity="0.8"/>
  <!-- Label -->
  <text x="80" y="640" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#F0D8B0" opacity="0.7" font-style="italic">Paris · L'aube · Quai de la Seine</text>
</svg>
