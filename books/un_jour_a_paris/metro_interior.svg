<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="30%" stop-color="#1A1A1A"/>
      <stop offset="70%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="platform_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2820"/>
      <stop offset="100%" stop-color="#1A1810"/>
    </linearGradient>
  </defs>
  <!-- Tunnel background -->
  <rect width="1200" height="675" fill="#101010"/>
  <!-- Arched tunnel ceiling -->
  <ellipse cx="600" cy="-50" rx="700" ry="400" fill="#1A1A18" stroke="#252520" stroke-width="2"/>
  <!-- Tile walls - classic Paris metro cream tiles -->
  <rect x="0" y="60" width="1200" height="380" fill="#E8E0D0" opacity="0.12"/>
  <!-- Tile grid -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="140" x2="1200" y2="140" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="260" x2="1200" y2="260" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#3A3830" stroke-width="1" opacity="0.4"/>
  <!-- Vertical tile lines -->
  <line x1="120" y1="60" x2="120" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="240" y1="60" x2="240" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="60" x2="360" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="480" y1="60" x2="480" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="60" x2="600" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="720" y1="60" x2="720" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="840" y1="60" x2="840" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="60" x2="960" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <line x1="1080" y1="60" x2="1080" y2="420" stroke="#3A3830" stroke-width="1" opacity="0.3"/>
  <!-- Station name board - classic blue -->
  <rect x="360" y="75" width="480" height="65" fill="#1A3A6A" rx="3"/>
  <rect x="365" y="80" width="470" height="55" fill="#1A4A8A" rx="2"/>
  <text x="600" y="121" font-family="Arial,sans-serif" font-size="34" font-weight="bold"
        fill="white" text-anchor="middle" letter-spacing="3">CHÂTELET</text>
  <!-- Direction signs -->
  <rect x="50" y="160" width="220" height="40" fill="#1A3A6A" rx="3" opacity="0.9"/>
  <text x="160" y="186" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">◄ Direction Montrouge</text>
  <rect x="930" y="160" width="220" height="40" fill="#1A3A6A" rx="3" opacity="0.9"/>
  <text x="1040" y="186" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">Direction Clignancourt ►</text>
  <!-- Platform edge -->
  <rect x="0" y="420" width="1200" height="255" fill="url(#platform_floor)"/>
  <rect x="0" y="420" width="1200" height="5" fill="#4A4830" opacity="0.9"/>
  <!-- Yellow safety line -->
  <rect x="0" y="440" width="1200" height="6" fill="#F5C820" opacity="0.7"/>
  <!-- Fluorescent lights -->
  <rect x="80"  y="40" width="160" height="18" fill="#F0F0E0" opacity="0.7" rx="9"/>
  <rect x="320" y="40" width="160" height="18" fill="#F0F0E0" opacity="0.7" rx="9"/>
  <rect x="560" y="40" width="160" height="18" fill="#F0F0E0" opacity="0.7" rx="9"/>
  <rect x="800" y="40" width="160" height="18" fill="#F0F0E0" opacity="0.7" rx="9"/>
  <rect x="1040" y="40" width="160" height="18" fill="#F0F0E0" opacity="0.7" rx="9"/>
  <!-- Light glow -->
  <rect x="80"  y="58" width="160" height="30" fill="#F0F0C0" opacity="0.04"/>
  <rect x="560" y="58" width="160" height="30" fill="#F0F0C0" opacity="0.04"/>
  <!-- Bench -->
  <rect x="860" y="460" width="240" height="12" fill="#5A4838" rx="3"/>
  <rect x="880" y="472" width="16" height="50" fill="#4A3828"/>
  <rect x="1068" y="472" width="16" height="50" fill="#4A3828"/>
  <!-- Poster frame -->
  <rect x="100" y="210" width="180" height="180" fill="#2A2820" rx="3"/>
  <rect x="108" y="218" width="164" height="164" fill="#3A5A8A" opacity="0.6"/>
  <text x="190" y="308" font-family="serif" font-size="15" fill="#F0E0C0" text-anchor="middle" font-style="italic">Visitez</text>
  <text x="190" y="328" font-family="serif" font-size="15" fill="#F0E0C0" text-anchor="middle" font-style="italic">la France</text>
  <!-- Label -->
  <text x="80" y="655" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#F0E6CC" opacity="0.6" font-style="italic">Métro parisien · Quai</text>
</svg>
