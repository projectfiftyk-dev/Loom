<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1E14"/>
      <stop offset="100%" stop-color="#1A1208"/>
    </linearGradient>
    <linearGradient id="table_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6040"/>
      <stop offset="100%" stop-color="#6B4828"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D870" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C89820" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Room -->
  <rect width="1200" height="675" fill="url(#wall)"/>
  <!-- Floor -->
  <rect x="0" y="500" width="1200" height="175" fill="#3A2818"/>
  <rect x="0" y="500" width="1200" height="3" fill="#5A3820" opacity="0.8"/>
  <!-- Warm light from window -->
  <ellipse cx="960" cy="180" rx="200" ry="150" fill="#F0C050" opacity="0.08"/>
  <!-- Window -->
  <rect x="860" y="80" width="220" height="280" fill="#4A6880" opacity="0.6" rx="5"/>
  <rect x="860" y="80" width="220" height="280" fill="none" stroke="#8B6A40" stroke-width="6" rx="5"/>
  <line x1="970" y1="80" x2="970" y2="360" stroke="#8B6A40" stroke-width="4"/>
  <line x1="860" y1="220" x2="1080" y2="220" stroke="#8B6A40" stroke-width="4"/>
  <!-- Pendant lamp -->
  <line x1="300" y1="0" x2="300" y2="130" stroke="#6B4828" stroke-width="3"/>
  <ellipse cx="300" cy="145" rx="55" ry="35" fill="#8B6020"/>
  <ellipse cx="300" cy="145" rx="42" ry="28" fill="url(#lamp)"/>
  <!-- Table -->
  <ellipse cx="370" cy="490" rx="200" ry="30" fill="#4A3020" opacity="0.9"/>
  <rect x="170" y="430" width="400" height="60" fill="url(#table_top)" rx="8"/>
  <rect x="260" y="490" width="20" height="100" fill="#4A3020"/>
  <rect x="440" y="490" width="20" height="100" fill="#4A3020"/>
  <!-- Coffee cup on table -->
  <ellipse cx="340" cy="435" rx="35" ry="10" fill="#8B6040" opacity="0.7"/>
  <rect x="305" y="415" width="70" height="25" fill="#F5F0E8" rx="4"/>
  <ellipse cx="340" cy="415" rx="35" ry="8" fill="#C8A870"/>
  <ellipse cx="340" cy="415" rx="28" ry="6" fill="#5A3018"/>
  <!-- Chairs -->
  <rect x="100" y="420" width="100" height="10" fill="#6B4828" rx="5"/>
  <rect x="110" y="430" width="12" height="80" fill="#5A3820"/>
  <rect x="178" y="430" width="12" height="80" fill="#5A3820"/>
  <rect x="100" y="465" width="100" height="8" fill="#6B4828" rx="4"/>
  <!-- Chalkboard menu -->
  <rect x="50" y="100" width="280" height="200" fill="#1A2818" rx="4"/>
  <rect x="58" y="108" width="264" height="184" fill="#243520" rx="3"/>
  <text x="190" y="150" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#D8F0C0" text-anchor="middle" opacity="0.9">Getränke</text>
  <text x="190" y="180" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#C0E0A0" text-anchor="middle" opacity="0.8">Kaffee · 2,50 €</text>
  <text x="190" y="205" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#C0E0A0" text-anchor="middle" opacity="0.8">Tee · 2,00 €</text>
  <text x="190" y="230" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#C0E0A0" text-anchor="middle" opacity="0.8">Wasser · 1,50 €</text>
  <text x="190" y="255" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#C0E0A0" text-anchor="middle" opacity="0.8">Orangensaft · 3,00 €</text>
  <!-- Label -->
  <text x="80" y="648" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#F0E6CC" opacity="0.6" font-style="italic">Café Morgenrot · Innenraum</text>
</svg>
