<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bint_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1610"/>
      <stop offset="100%" stop-color="#140E08"/>
    </linearGradient>
    <linearGradient id="shelf_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A4828"/>
      <stop offset="100%" stop-color="#4A3018"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bint_wall)"/>
  <!-- Floor -->
  <rect x="0" y="520" width="1200" height="155" fill="#2A1E10"/>
  <rect x="0" y="520" width="1200" height="3" fill="#4A3020" opacity="0.8"/>
  <!-- Back bookshelves -->
  <rect x="0"   y="50"  width="200" height="470" fill="url(#shelf_wood)"/>
  <rect x="200" y="50"  width="200" height="470" fill="url(#shelf_wood)" opacity="0.9"/>
  <rect x="400" y="50"  width="200" height="470" fill="url(#shelf_wood)"/>
  <rect x="800" y="50"  width="200" height="470" fill="url(#shelf_wood)" opacity="0.9"/>
  <rect x="1000" y="50" width="200" height="470" fill="url(#shelf_wood)"/>
  <!-- Shelf dividers (horizontal) -->
  <rect x="0"    y="160" width="400"  height="8" fill="#3A2010"/>
  <rect x="0"    y="280" width="400"  height="8" fill="#3A2010"/>
  <rect x="0"    y="400" width="400"  height="8" fill="#3A2010"/>
  <rect x="400"  y="160" width="200"  height="8" fill="#3A2010"/>
  <rect x="400"  y="280" width="200"  height="8" fill="#3A2010"/>
  <rect x="400"  y="400" width="200"  height="8" fill="#3A2010"/>
  <rect x="800"  y="160" width="400"  height="8" fill="#3A2010"/>
  <rect x="800"  y="280" width="400"  height="8" fill="#3A2010"/>
  <rect x="800"  y="400" width="400"  height="8" fill="#3A2010"/>
  <!-- Books on shelves — row 1 (top) -->
  <rect x="12"  y="90"  width="18" height="65" fill="#8B3A22" rx="1"/>
  <rect x="34"  y="85"  width="14" height="70" fill="#2A5A8B" rx="1"/>
  <rect x="52"  y="93"  width="20" height="62" fill="#4A8B3A" rx="1"/>
  <rect x="76"  y="88"  width="16" height="67" fill="#8B7A22" rx="1"/>
  <rect x="96"  y="91"  width="22" height="64" fill="#7A2A8B" rx="1"/>
  <rect x="122" y="87"  width="15" height="68" fill="#C06830" rx="1"/>
  <rect x="141" y="94"  width="19" height="61" fill="#3A6A8B" rx="1"/>
  <rect x="164" y="90"  width="17" height="65" fill="#8B3A5A" rx="1"/>
  <!-- Books — row 2 -->
  <rect x="12"  y="210" width="20" height="62" fill="#4A8B8B" rx="1"/>
  <rect x="36"  y="215" width="15" height="57" fill="#8B5A22" rx="1"/>
  <rect x="55"  y="208" width="22" height="64" fill="#5A3A8B" rx="1"/>
  <rect x="81"  y="212" width="17" height="60" fill="#8B8A22" rx="1"/>
  <rect x="102" y="210" width="19" height="62" fill="#228B5A" rx="1"/>
  <rect x="125" y="207" width="16" height="65" fill="#8B4A3A" rx="1"/>
  <rect x="145" y="214" width="21" height="58" fill="#2A8B8B" rx="1"/>
  <rect x="170" y="209" width="14" height="63" fill="#8B2A3A" rx="1"/>
  <!-- Warm lamp -->
  <ellipse cx="600" cy="30" rx="80" ry="20" fill="#6A4820"/>
  <ellipse cx="600" cy="30" rx="60" ry="15" fill="#F5C840" opacity="0.5"/>
  <line x1="600" y1="0" x2="600" y2="30" stroke="#4A3010" stroke-width="3"/>
  <!-- Light cone -->
  <polygon points="540,30 660,30 750,180 450,180" fill="#F5C840" opacity="0.04"/>
  <!-- Counter -->
  <rect x="580" y="440" width="360" height="80" fill="#6A4828" rx="6"/>
  <rect x="580" y="430" width="360" height="14" fill="#8A6040" rx="4"/>
  <!-- Small book stack on counter -->
  <rect x="620" y="410" width="50" height="22" fill="#4A6A8B" rx="2"/>
  <rect x="622" y="392" width="46" height="20" fill="#8B5A22" rx="2"/>
  <rect x="624" y="376" width="42" height="18" fill="#3A8B4A" rx="2"/>
  <!-- Label -->
  <text x="80" y="650" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#F0E6CC" opacity="0.6" font-style="italic">Buchhandlung Bauer · Innenraum</text>
</svg>
