<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bshop_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8DC"/>
      <stop offset="100%" stop-color="#D8C8A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bshop_sky)"/>
  <!-- Street -->
  <rect x="0" y="510" width="1200" height="165" fill="#4A4038"/>
  <rect x="0" y="510" width="1200" height="3" fill="#6A5848" opacity="0.7"/>
  <!-- Building -->
  <rect x="150" y="80" width="900" height="450" fill="#8A7A60"/>
  <!-- Brick texture (rows) -->
  <rect x="150" y="80" width="900" height="450" fill="none" stroke="#7A6A50" stroke-width="0"/>
  <line x1="150" y1="120" x2="1050" y2="120" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="160" x2="1050" y2="160" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="200" x2="1050" y2="200" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="240" x2="1050" y2="240" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="280" x2="1050" y2="280" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="320" x2="1050" y2="320" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="360" x2="1050" y2="360" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="400" x2="1050" y2="400" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="440" x2="1050" y2="440" stroke="#7A6A50" stroke-width="1.5" opacity="0.4"/>
  <!-- Windows -->
  <rect x="220" y="130" width="130" height="170" fill="#2A3848" opacity="0.75" rx="4"/>
  <line x1="285" y1="130" x2="285" y2="300" stroke="#3A4858" stroke-width="3"/>
  <line x1="220" y1="215" x2="350" y2="215" stroke="#3A4858" stroke-width="3"/>
  <rect x="760" y="130" width="130" height="170" fill="#2A3848" opacity="0.75" rx="4"/>
  <line x1="825" y1="130" x2="825" y2="300" stroke="#3A4858" stroke-width="3"/>
  <line x1="760" y1="215" x2="890" y2="215" stroke="#3A4858" stroke-width="3"/>
  <!-- Large display window -->
  <rect x="380" y="310" width="440" height="220" fill="#2A3848" opacity="0.7" rx="3"/>
  <line x1="600" y1="310" x2="600" y2="530" stroke="#3A4858" stroke-width="4"/>
  <!-- Books displayed in window -->
  <rect x="400" y="360" width="28" height="45" fill="#8B3A22" rx="2"/>
  <rect x="432" y="355" width="22" height="50" fill="#2A5A8B" rx="2"/>
  <rect x="458" y="365" width="30" height="40" fill="#4A8B3A" rx="2"/>
  <rect x="492" y="358" width="24" height="47" fill="#8B7A22" rx="2"/>
  <rect x="520" y="362" width="26" height="43" fill="#7A2A8B" rx="2"/>
  <rect x="615" y="358" width="28" height="47" fill="#8B4A22" rx="2"/>
  <rect x="647" y="354" width="22" height="51" fill="#225A8B" rx="2"/>
  <rect x="673" y="362" width="30" height="43" fill="#3A8B5A" rx="2"/>
  <rect x="707" y="356" width="24" height="49" fill="#8B8A22" rx="2"/>
  <rect x="735" y="360" width="26" height="45" fill="#8B2A5A" rx="2"/>
  <!-- Door -->
  <rect x="540" y="390" width="120" height="140" fill="#4A3020" rx="4"/>
  <rect x="548" y="398" width="45" height="60" fill="#3A5060" opacity="0.6" rx="2"/>
  <rect x="607" y="398" width="45" height="60" fill="#3A5060" opacity="0.6" rx="2"/>
  <!-- Shop sign -->
  <rect x="380" y="100" width="440" height="60" fill="#2A1A0A" rx="5"/>
  <text x="600" y="140" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#D4A840"
        text-anchor="middle" font-style="italic">Buchhandlung Bauer</text>
  <!-- Label -->
  <text x="80" y="620" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#F0E6CC" opacity="0.7" font-style="italic">Berlin · Buchhandlung · Mittag</text>
</svg>
