<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="100%" stop-color="#E8D5B0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5E4A"/>
      <stop offset="100%" stop-color="#4A3F2E"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="900" cy="140" r="55" fill="#F5C842" opacity="0.85"/>
  <circle cx="900" cy="140" r="75" fill="#F5C842" opacity="0.18"/>
  <!-- TV Tower (Fernsehturm) silhouette -->
  <rect x="575" y="80" width="12" height="320" fill="#2A2820" opacity="0.85"/>
  <ellipse cx="581" cy="220" rx="38" ry="42" fill="#2A2820" opacity="0.85"/>
  <circle cx="581" cy="185" r="8" fill="#E8C040" opacity="0.7"/>
  <!-- City buildings silhouette -->
  <rect x="0"    y="340" width="90"  height="200" fill="#2A2820" opacity="0.8"/>
  <rect x="85"   y="300" width="70"  height="240" fill="#322C22" opacity="0.8"/>
  <rect x="150"  y="360" width="110" height="180" fill="#2A2820" opacity="0.8"/>
  <rect x="255"  y="320" width="60"  height="220" fill="#3A3428" opacity="0.8"/>
  <rect x="310"  y="370" width="90"  height="170" fill="#2A2820" opacity="0.8"/>
  <rect x="395"  y="290" width="55"  height="250" fill="#322C22" opacity="0.8"/>
  <rect x="445"  y="345" width="85"  height="195" fill="#2A2820" opacity="0.8"/>
  <rect x="640"  y="330" width="75"  height="210" fill="#322C22" opacity="0.8"/>
  <rect x="710"  y="360" width="100" height="180" fill="#2A2820" opacity="0.8"/>
  <rect x="805"  y="310" width="80"  height="230" fill="#3A3428" opacity="0.8"/>
  <rect x="880"  y="355" width="65"  height="185" fill="#2A2820" opacity="0.8"/>
  <rect x="940"  y="290" width="95"  height="250" fill="#322C22" opacity="0.8"/>
  <rect x="1030" y="350" width="80"  height="190" fill="#2A2820" opacity="0.8"/>
  <rect x="1105" y="380" width="95"  height="160" fill="#322C22" opacity="0.8"/>
  <!-- Street -->
  <rect x="0" y="530" width="1200" height="145" fill="url(#ground)"/>
  <!-- Cobblestone hint -->
  <rect x="0" y="530" width="1200" height="4" fill="#8B7355" opacity="0.5"/>
  <!-- Label -->
  <text x="80" y="610" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#F0E6CC" opacity="0.7" font-style="italic">Berlin · Alexanderplatz · Morgen</text>
</svg>
