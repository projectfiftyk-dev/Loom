<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="hall_ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0E06"/>
      <stop offset="100%" stop-color="#2A1A0A"/>
    </linearGradient>
    <linearGradient id="hall_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5A38"/>
      <stop offset="100%" stop-color="#5A3A20"/>
    </linearGradient>
    <radialGradient id="torch_light" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F0A030" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F0A030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle_glow_c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5C050" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark ceiling -->
  <rect width="1200" height="675" fill="url(#hall_ceiling)"/>
  <rect width="1200" height="675" fill="url(#torch_light)"/>

  <!-- Stone arch columns flanking the hall -->
  <rect x="0" y="0" width="100" height="675" fill="#2A2018"/>
  <ellipse cx="100" cy="0" rx="100" ry="200" fill="#2A2018"/>
  <rect x="1100" y="0" width="100" height="675" fill="#2A2018"/>
  <ellipse cx="1100" cy="0" rx="100" ry="200" fill="#2A2018"/>
  <!-- Column details -->
  <rect x="60" y="0" width="40" height="675" fill="#3A2C18" opacity="0.7"/>
  <rect x="1100" y="0" width="40" height="675" fill="#3A2C18" opacity="0.7"/>

  <!-- More columns in background -->
  <rect x="250" y="0" width="30" height="400" fill="#2A2010" opacity="0.6"/>
  <rect x="450" y="0" width="30" height="400" fill="#2A2010" opacity="0.6"/>
  <rect x="720" y="0" width="30" height="400" fill="#2A2010" opacity="0.6"/>
  <rect x="920" y="0" width="30" height="400" fill="#2A2010" opacity="0.6"/>

  <!-- Arched ceiling decorative elements -->
  <path d="M 100,0 Q 200,100 300,80 Q 400,60 500,90 Q 600,120 700,90 Q 800,60 900,80 Q 1000,100 1100,0" fill="none" stroke="#4A3820" stroke-width="8" opacity="0.5"/>
  <path d="M 100,0 Q 200,130 300,110 Q 600,140 900,110 Q 1000,130 1100,0" fill="none" stroke="#3A2818" stroke-width="5" opacity="0.4"/>

  <!-- TORCHES on columns — warm dancing light -->
  <!-- Left torches -->
  <rect x="80" y="120" width="12" height="35" fill="#8B6020" rx="2"/>
  <ellipse cx="86" cy="118" rx="10" ry="8" fill="#E89020" opacity="0.9"/>
  <ellipse cx="86" cy="114" rx="7" ry="6" fill="#F8B040" opacity="0.85"/>
  <ellipse cx="86" cy="110" rx="4" ry="4" fill="#FDD060" opacity="0.8"/>
  <!-- Glow -->
  <ellipse cx="86" cy="130" rx="80" ry="90" fill="#F0A030" opacity="0.1"/>

  <rect x="80" y="280" width="12" height="35" fill="#8B6020" rx="2"/>
  <ellipse cx="86" cy="278" rx="10" ry="8" fill="#E89020" opacity="0.9"/>
  <ellipse cx="86" cy="274" rx="7" ry="6" fill="#F8B040" opacity="0.85"/>
  <ellipse cx="86" cy="270" rx="4" ry="4" fill="#FDD060" opacity="0.8"/>
  <ellipse cx="86" cy="290" rx="80" ry="90" fill="#F0A030" opacity="0.08"/>

  <!-- Right torches -->
  <rect x="1108" y="120" width="12" height="35" fill="#8B6020" rx="2"/>
  <ellipse cx="1114" cy="118" rx="10" ry="8" fill="#E89020" opacity="0.9"/>
  <ellipse cx="1114" cy="114" rx="7" ry="6" fill="#F8B040" opacity="0.85"/>
  <ellipse cx="1114" cy="110" rx="4" ry="4" fill="#FDD060" opacity="0.8"/>
  <ellipse cx="1114" cy="130" rx="80" ry="90" fill="#F0A030" opacity="0.1"/>

  <rect x="1108" y="280" width="12" height="35" fill="#8B6020" rx="2"/>
  <ellipse cx="1114" cy="278" rx="10" ry="8" fill="#E89020" opacity="0.9"/>
  <ellipse cx="1114" cy="274" rx="7" ry="6" fill="#F8B040" opacity="0.85"/>
  <ellipse cx="1114" cy="110" rx="4" ry="4" fill="#FDD060" opacity="0.8"/>

  <!-- Background torches on middle columns -->
  <rect x="258" y="90" width="10" height="30" fill="#8B6020" rx="1"/>
  <ellipse cx="263" cy="88" rx="8" ry="6" fill="#E89020" opacity="0.85"/>
  <ellipse cx="263" cy="100" rx="50" ry="60" fill="#F0A030" opacity="0.08"/>
  <rect x="458" y="85" width="10" height="30" fill="#8B6020" rx="1"/>
  <ellipse cx="463" cy="83" rx="8" ry="6" fill="#E89020" opacity="0.85"/>
  <rect x="728" y="90" width="10" height="30" fill="#8B6020" rx="1"/>
  <ellipse cx="733" cy="88" rx="8" ry="6" fill="#E89020" opacity="0.85"/>
  <rect x="928" y="85" width="10" height="30" fill="#8B6020" rx="1"/>
  <ellipse cx="933" cy="83" rx="8" ry="6" fill="#E89020" opacity="0.85"/>

  <!-- Overhead chandelier with candles — center -->
  <ellipse cx="600" cy="60" rx="90" ry="20" fill="#5A4020" opacity="0.8"/>
  <ellipse cx="600" cy="55" rx="85" ry="16" fill="#6A5028" opacity="0.7"/>
  <!-- Chains -->
  <line x1="600" y1="0" x2="600" y2="55" stroke="#4A3818" stroke-width="4"/>
  <!-- Candles on chandelier -->
  <rect x="530" y="48" width="8" height="16" fill="#E8D8B0" rx="1"/>
  <ellipse cx="534" cy="46" rx="5" ry="4" fill="#F8C840" opacity="0.8"/>
  <rect x="565" y="44" width="8" height="20" fill="#E8D8B0" rx="1"/>
  <ellipse cx="569" cy="42" rx="5" ry="4" fill="#F8C840" opacity="0.9"/>
  <rect x="596" y="42" width="8" height="22" fill="#E8D8B0" rx="1"/>
  <ellipse cx="600" cy="40" rx="5" ry="4" fill="#F8C840" opacity="0.9"/>
  <rect x="627" y="44" width="8" height="20" fill="#E8D8B0" rx="1"/>
  <ellipse cx="631" cy="42" rx="5" ry="4" fill="#F8C840" opacity="0.9"/>
  <rect x="658" y="48" width="8" height="16" fill="#E8D8B0" rx="1"/>
  <ellipse cx="662" cy="46" rx="5" ry="4" fill="#F8C840" opacity="0.8"/>
  <!-- Chandelier glow -->
  <ellipse cx="600" cy="120" rx="200" ry="160" fill="url(#candle_glow_c)"/>

  <!-- Floor — stone tiles, warm -->
  <rect x="0" y="500" width="1200" height="175" fill="url(#hall_floor)"/>
  <rect x="0" y="500" width="1200" height="4" fill="#9A7A50" opacity="0.5"/>
  <!-- Tile pattern -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="150" y1="500" x2="150" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="500" x2="300" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="450" y1="500" x2="450" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="600" y1="500" x2="600" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="750" y1="500" x2="750" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="900" y1="500" x2="900" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>
  <line x1="1050" y1="500" x2="1050" y2="675" stroke="#6A4A28" stroke-width="1.5" opacity="0.3"/>

  <!-- FEAST TABLE — background, laden with food -->
  <rect x="120" y="385" width="960" height="55" fill="#5A3A18" rx="4"/>
  <rect x="120" y="380" width="960" height="12" fill="#7A5228" rx="3"/>
  <!-- Tablecloth hint -->
  <rect x="125" y="380" width="950" height="58" fill="#E8E0C8" opacity="0.15" rx="2"/>
  <!-- Food on table — simplified shapes -->
  <ellipse cx="250" cy="380" rx="30" ry="15" fill="#C89040" opacity="0.8"/>
  <ellipse cx="400" cy="378" rx="25" ry="20" fill="#8B3018" opacity="0.7"/>
  <ellipse cx="550" cy="380" rx="22" ry="12" fill="#D0A850" opacity="0.8"/>
  <ellipse cx="700" cy="378" rx="28" ry="16" fill="#C89040" opacity="0.8"/>
  <ellipse cx="850" cy="380" rx="20" ry="14" fill="#8B3018" opacity="0.7"/>
  <ellipse cx="950" cy="378" rx="25" ry="18" fill="#D0A850" opacity="0.8"/>
  <!-- Goblets -->
  <rect x="300" y="368" width="8" height="22" fill="#D0A840" rx="1"/>
  <ellipse cx="304" cy="366" rx="10" ry="5" fill="#C89030"/>
  <rect x="480" y="366" width="8" height="24" fill="#D0A840" rx="1"/>
  <ellipse cx="484" cy="364" rx="10" ry="5" fill="#C89030"/>
  <rect x="620" y="368" width="8" height="22" fill="#D0A840" rx="1"/>
  <ellipse cx="624" cy="366" rx="10" ry="5" fill="#C89030"/>
  <rect x="800" y="366" width="8" height="22" fill="#D0A840" rx="1"/>
  <ellipse cx="804" cy="364" rx="10" ry="5" fill="#C89030"/>

  <!-- DANCING COUPLES in midground — silhouettes -->
  <!-- Couple 1 left -->
  <ellipse cx="220" cy="440" rx="20" ry="18" fill="#C84840" opacity="0.7"/>
  <rect x="210" y="455" width="20" height="55" fill="#C84840" opacity="0.7" rx="2"/>
  <ellipse cx="180" cy="438" rx="16" ry="16" fill="#3A2018" opacity="0.7"/>
  <rect x="172" y="452" width="16" height="52" fill="#3A2018" opacity="0.7" rx="2"/>
  <!-- Arms of couple 1 joined -->
  <path d="M 200,460 Q 195,455 185,456" fill="none" stroke="#3A2018" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Couple 2 center-left -->
  <ellipse cx="430" cy="435" rx="22" ry="20" fill="#4A5A8A" opacity="0.7"/>
  <rect x="419" y="452" width="22" height="58" fill="#4A5A8A" opacity="0.7" rx="2"/>
  <ellipse cx="475" cy="432" rx="20" ry="18" fill="#8B3050" opacity="0.7"/>
  <!-- Dress flare -->
  <path d="M 465,450 Q 455,490 445,510 Q 480,510 495,490 Q 490,460 485,448" fill="#8B3050" opacity="0.65"/>

  <!-- Couple 3 center-right -->
  <ellipse cx="730" cy="438" rx="18" ry="17" fill="#6A4818" opacity="0.7"/>
  <rect x="721" y="453" width="18" height="52" fill="#6A4818" opacity="0.7" rx="2"/>
  <ellipse cx="770" cy="435" rx="22" ry="19" fill="#A84028" opacity="0.7"/>
  <path d="M 758,452 Q 748,490 740,510 Q 775,510 785,490 Q 782,462 778,452" fill="#A84028" opacity="0.65"/>

  <!-- Couple 4 right -->
  <ellipse cx="990" cy="442" rx="18" ry="17" fill="#3A2A18" opacity="0.7"/>
  <rect x="981" y="456" width="18" height="50" fill="#3A2A18" opacity="0.7" rx="2"/>
  <ellipse cx="1030" cy="438" rx="20" ry="18" fill="#7A3A50" opacity="0.7"/>
  <path d="M 1018,455 Q 1010,488 1002,508 Q 1035,508 1045,488 Q 1040,460 1036,455" fill="#7A3A50" opacity="0.65"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- JULIET — across the hall, near far wall, catching the light     -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- She stands near a torch — lit by it, distinct from the crowd -->
  <ellipse cx="600" cy="455" rx="26" ry="22" fill="#F5C8A0"/>
  <!-- Her gown — rich golden yellow, flowing -->
  <path d="M 576,465 Q 560,490 558,520 Q 600,528 642,520 Q 640,490 624,465 Z" fill="#D4A030" opacity="0.95"/>
  <rect x="585" y="462" width="30" height="60" fill="#D4A030" opacity="0.9"/>
  <!-- Her face, lit by torch -->
  <ellipse cx="600" cy="440" rx="18" ry="18" fill="#EEC8A0"/>
  <!-- Hair dark, pearl ornament -->
  <ellipse cx="600" cy="425" rx="20" ry="12" fill="#3A2010"/>
  <circle cx="610" cy="420" r="5" fill="#E8D8C0"/>
  <!-- Eyes — looking across the hall at you -->
  <circle cx="594" cy="440" r="4" fill="#2A1008"/>
  <circle cx="606" cy="440" r="4" fill="#2A1008"/>
  <circle cx="595" cy="439" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="607" cy="439" r="1.5" fill="white" opacity="0.8"/>
  <!-- Small smile -->
  <path d="M 595,448 Q 600,451 605,448" fill="none" stroke="#C06060" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Companion beside her — nurse silhouette -->
  <ellipse cx="640" cy="460" rx="18" ry="16" fill="#8A6040" opacity="0.8"/>
  <rect x="630" y="473" width="20" height="55" fill="#8A6040" opacity="0.8" rx="1"/>
  <!-- White coif on nurse -->
  <ellipse cx="640" cy="447" rx="16" ry="10" fill="#E8E0D0" opacity="0.9"/>

  <!-- Torch near Juliet lighting her from behind -->
  <rect x="630" y="350" width="10" height="30" fill="#8B6020" rx="1"/>
  <ellipse cx="635" cy="348" rx="9" ry="7" fill="#F0A020" opacity="0.9"/>
  <ellipse cx="635" cy="344" rx="6" ry="5" fill="#FCC040" opacity="0.85"/>
  <ellipse cx="635" cy="380" rx="70" ry="80" fill="#F0A030" opacity="0.12"/>

  <!-- Masqued attendees in foreground — left, Romeo's POV -->
  <!-- Benvolio silhouette with mask -->
  <ellipse cx="155" cy="455" rx="20" ry="19" fill="#4A6A3A" opacity="0.8"/>
  <rect x="145" y="472" width="20" height="55" fill="#4A6A3A" opacity="0.8" rx="1"/>
  <!-- Mask on face -->
  <rect x="148" y="448" width="14" height="10" fill="#C8B880" rx="2" opacity="0.9"/>
  <!-- Romeo's mask — visible on the side -->
  <ellipse cx="200" cy="460" rx="22" ry="20" fill="#3A2A18" opacity="0.85"/>
  <rect x="190" y="477" width="20" height="55" fill="#3A2A18" opacity="0.85" rx="1"/>
  <rect x="190" y="452" width="18" height="12" fill="#D0B870" rx="3" opacity="0.95"/>

  <!-- Music — lute player in corner, barely visible -->
  <ellipse cx="1120" cy="470" rx="14" ry="14" fill="#3A2810" opacity="0.6"/>
  <rect x="1112" y="482" width="16" height="45" fill="#3A2810" opacity="0.6" rx="1"/>
  <!-- Lute shape -->
  <ellipse cx="1104" cy="478" rx="12" ry="10" fill="#8B6020" opacity="0.7" transform="rotate(-20 1104 478)"/>
  <line x1="1100" y1="466" x2="1112" y2="488" stroke="#C08030" stroke-width="2" opacity="0.7"/>

  <!-- Label -->
  <text x="60" y="650" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#F0D890" opacity="0.65" font-style="italic">A Feast at Capulet's · Verona · c. 1595</text>
</svg>
