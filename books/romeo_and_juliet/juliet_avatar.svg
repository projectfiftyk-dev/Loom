<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Background — deep rose -->
  <circle cx="60" cy="60" r="58" fill="#8B2040"/>
  <circle cx="60" cy="60" r="55" fill="#A83050"/>

  <!-- Hair — rich dark brown, Renaissance style with centre part -->
  <ellipse cx="60" cy="42" rx="36" ry="32" fill="#3A2010"/>
  <!-- Hair braid/wrap detail -->
  <path d="M 26,38 Q 20,55 22,75" fill="none" stroke="#2A1808" stroke-width="5" stroke-linecap="round"/>
  <path d="M 94,38 Q 100,55 98,75" fill="none" stroke="#2A1808" stroke-width="5" stroke-linecap="round"/>
  <!-- Hair texture -->
  <path d="M 30,30 Q 45,18 60,15 Q 75,18 90,30" fill="none" stroke="#5A3820" stroke-width="2" opacity="0.5"/>

  <!-- Pearl/flower hair ornament -->
  <circle cx="60" cy="18" r="7" fill="#E8D8C0"/>
  <circle cx="60" cy="18" r="4" fill="#F0E8D0"/>
  <circle cx="72" cy="22" r="4" fill="#E8D8C0"/>
  <circle cx="48" cy="22" r="4" fill="#E8D8C0"/>

  <!-- Face — oval, luminous -->
  <ellipse cx="60" cy="70" rx="26" ry="30" fill="#E8C8A8"/>
  <!-- Soft forehead -->
  <ellipse cx="60" cy="50" rx="24" ry="18" fill="#EED0B0"/>

  <!-- Eyes — dark, expressive, looking slightly upward -->
  <ellipse cx="50" cy="65" rx="8.5" ry="6" fill="white"/>
  <ellipse cx="70" cy="65" rx="8.5" ry="6" fill="white"/>
  <!-- Irises — warm dark brown -->
  <circle cx="51" cy="65" r="5.5" fill="#3A1808"/>
  <circle cx="71" cy="65" r="5.5" fill="#3A1808"/>
  <!-- Pupils -->
  <circle cx="51" cy="65" r="3" fill="#1A0800"/>
  <circle cx="71" cy="65" r="3" fill="#1A0800"/>
  <!-- Eye shine -->
  <circle cx="53" cy="63" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="73" cy="63" r="1.5" fill="white" opacity="0.9"/>
  <!-- Upper eyelid line -->
  <path d="M 42,62 Q 51,58 59,62" fill="none" stroke="#5A2808" stroke-width="1.5"/>
  <path d="M 61,62 Q 70,58 78,62" fill="none" stroke="#5A2808" stroke-width="1.5"/>
  <!-- Lower lashes (subtle) -->
  <path d="M 43,68 Q 51,71 59,68" fill="none" stroke="#8A5030" stroke-width="1" opacity="0.4"/>
  <path d="M 61,68 Q 70,71 77,68" fill="none" stroke="#8A5030" stroke-width="1" opacity="0.4"/>

  <!-- Brows — softly arched -->
  <path d="M 42,59 Q 51,55 58,58" fill="none" stroke="#4A2808" stroke-width="2" stroke-linecap="round"/>
  <path d="M 62,58 Q 69,55 78,59" fill="none" stroke="#4A2808" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose — delicate -->
  <path d="M 58,68 Q 57,74 60,76 Q 63,74 62,68" fill="#D8A880" opacity="0.6"/>
  <circle cx="57" cy="74" r="2" fill="#C89870" opacity="0.5"/>
  <circle cx="63" cy="74" r="2" fill="#C89870" opacity="0.5"/>

  <!-- Lips — full, slightly parted, rose-pink -->
  <path d="M 50,83 Q 60,79 70,83" fill="#D06070" stroke="#B84858" stroke-width="1"/>
  <path d="M 50,83 Q 60,88 70,83" fill="#C05060" stroke="#A03848" stroke-width="1"/>
  <!-- Cupid's bow -->
  <path d="M 50,83 Q 55,80 60,82 Q 65,80 70,83" fill="none" stroke="#B84858" stroke-width="1"/>

  <!-- Rosy cheeks — soft blush -->
  <circle cx="40" cy="74" r="8" fill="#E87060" opacity="0.2"/>
  <circle cx="80" cy="74" r="8" fill="#E87060" opacity="0.2"/>

  <!-- Gown collar — white Renaissance ruff -->
  <ellipse cx="60" cy="108" rx="32" ry="14" fill="#E8E0D0"/>
  <path d="M 28,108 Q 44,100 60,103 Q 76,100 92,108" fill="none" stroke="#D0C8B8" stroke-width="2"/>
  <!-- Gown — deep crimson -->
  <rect x="32" y="102" width="56" height="18" fill="#8B1A30" rx="2"/>
</svg>
