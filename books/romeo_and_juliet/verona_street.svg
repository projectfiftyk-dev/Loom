<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="afternoon_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AB8E0"/>
      <stop offset="45%" stop-color="#A8CCE8"/>
      <stop offset="80%" stop-color="#D4884A"/>
      <stop offset="100%" stop-color="#E09050"/>
    </linearGradient>
    <linearGradient id="cobble_floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A7A60"/>
      <stop offset="100%" stop-color="#6A5A48"/>
    </linearGradient>
    <linearGradient id="shadow_left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1208" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1A1208" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun_haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C840" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F5C840" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sun_glare" cx="85%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#FFEE88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFEE88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky — afternoon, hot Italian sun, tension in the air -->
  <rect width="1200" height="675" fill="url(#afternoon_sky)"/>
  <!-- Sun glare upper right -->
  <rect width="1200" height="675" fill="url(#sun_glare)"/>
  <!-- A few high clouds -->
  <ellipse cx="200" cy="80" rx="100" ry="28" fill="white" opacity="0.45"/>
  <ellipse cx="260" cy="72" rx="70" ry="22" fill="white" opacity="0.35"/>
  <ellipse cx="550" cy="55" rx="80" ry="20" fill="white" opacity="0.3"/>
  <ellipse cx="620" cy="48" rx="55" ry="16" fill="white" opacity="0.2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VERONA ARCHITECTURE — LEFT SIDE — tall palazzo         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Left building — large palazzo, warm ochre stone -->
  <rect x="0" y="60" width="340" height="540" fill="#C8A060"/>
  <rect x="4" y="64" width="332" height="532" fill="#D4AA68"/>
  <!-- Stone courses -->
  <line x1="0" y1="150" x2="340" y2="150" stroke="#B89050" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="240" x2="340" y2="240" stroke="#B89050" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="330" x2="340" y2="330" stroke="#B89050" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="420" x2="340" y2="420" stroke="#B89050" stroke-width="2" opacity="0.4"/>
  <!-- Rusticated base — darker stone at street level -->
  <rect x="0" y="470" width="340" height="130" fill="#B89058"/>
  <rect x="0" y="467" width="340" height="8" fill="#A87840" opacity="0.6"/>
  <!-- Left palazzo — windows with arched tops -->
  <rect x="30" y="90" width="70" height="100" fill="#5A3818" rx="2"/>
  <path d="M 30,90 Q 65,68 100,90" fill="#4A2C10"/>
  <rect x="33" y="92" width="64" height="94" fill="#7A5030" opacity="0.4"/>
  <!-- window light  -->
  <rect x="34" y="93" width="62" height="90" fill="#F0C060" opacity="0.12"/>

  <rect x="180" y="90" width="70" height="100" fill="#5A3818" rx="2"/>
  <path d="M 180,90 Q 215,68 250,90" fill="#4A2C10"/>
  <rect x="183" y="92" width="64" height="94" fill="#7A5030" opacity="0.4"/>

  <rect x="30" y="240" width="70" height="100" fill="#5A3818" rx="2"/>
  <path d="M 30,240 Q 65,218 100,240" fill="#4A2C10"/>
  <rect x="180" y="240" width="70" height="100" fill="#5A3818" rx="2"/>
  <path d="M 180,240 Q 215,218 250,240" fill="#4A2C10"/>

  <rect x="30" y="370" width="70" height="90" fill="#5A3818" rx="2"/>
  <path d="M 30,370 Q 65,350 100,370" fill="#4A2C10"/>
  <rect x="180" y="370" width="70" height="90" fill="#5A3818" rx="2"/>
  <path d="M 180,370 Q 215,350 250,370" fill="#4A2C10"/>

  <!-- Cornice / roof edge -->
  <rect x="0" y="58" width="340" height="14" fill="#A87840"/>
  <rect x="0" y="56" width="340" height="6" fill="#BF9050"/>
  <!-- Battlement silhouette atop -->
  <rect x="40" y="40" width="30" height="20" fill="#A87840"/>
  <rect x="90" y="40" width="30" height="20" fill="#A87840"/>
  <rect x="140" y="40" width="30" height="20" fill="#A87840"/>
  <rect x="190" y="40" width="30" height="20" fill="#A87840"/>
  <rect x="240" y="40" width="30" height="20" fill="#A87840"/>
  <rect x="290" y="40" width="30" height="20" fill="#A87840"/>

  <!-- Shadow cast by left building onto street -->
  <rect x="0" y="460" width="1200" height="215" fill="url(#shadow_left)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VERONA ARCHITECTURE — RIGHT SIDE — narrower buildings  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Right building cluster -->
  <rect x="860" y="100" width="340" height="500" fill="#C09A58"/>
  <rect x="864" y="104" width="332" height="492" fill="#CCa460"/>
  <!-- Stone courses right -->
  <line x1="860" y1="190" x2="1200" y2="190" stroke="#A87840" stroke-width="2" opacity="0.4"/>
  <line x1="860" y1="280" x2="1200" y2="280" stroke="#A87840" stroke-width="2" opacity="0.4"/>
  <line x1="860" y1="370" x2="1200" y2="370" stroke="#A87840" stroke-width="2" opacity="0.4"/>
  <line x1="860" y1="460" x2="1200" y2="460" stroke="#A87840" stroke-width="2" opacity="0.4"/>
  <!-- Rusticated base right -->
  <rect x="860" y="470" width="340" height="130" fill="#B09050"/>
  <rect x="860" y="467" width="340" height="8" fill="#A07838" opacity="0.6"/>
  <!-- Right windows -->
  <rect x="890" y="130" width="65" height="95" fill="#4A2810" rx="2"/>
  <path d="M 890,130 Q 922,110 955,130" fill="#3A2008"/>
  <rect x="1040" y="130" width="65" height="95" fill="#4A2810" rx="2"/>
  <path d="M 1040,130 Q 1072,110 1105,130" fill="#3A2008"/>
  <rect x="890" y="280" width="65" height="90" fill="#4A2810" rx="2"/>
  <path d="M 890,280 Q 922,260 955,280" fill="#3A2008"/>
  <rect x="1040" y="280" width="65" height="90" fill="#4A2810" rx="2"/>
  <path d="M 1040,280 Q 1072,260 1105,280" fill="#3A2008"/>
  <rect x="890" y="380" width="65" height="80" fill="#4A2810" rx="2"/>
  <path d="M 890,380 Q 922,362 955,380" fill="#3A2008"/>
  <rect x="1040" y="380" width="65" height="80" fill="#4A2810" rx="2"/>
  <path d="M 1040,380 Q 1072,362 1105,380" fill="#3A2008"/>
  <!-- Cornice right -->
  <rect x="860" y="98" width="340" height="12" fill="#A07838"/>
  <rect x="860" y="96" width="340" height="6" fill="#B8884A"/>
  <!-- Tower right — taller element -->
  <rect x="1120" y="30" width="80" height="72" fill="#B89050"/>
  <rect x="1120" y="28" width="80" height="8" fill="#C8A060"/>
  <rect x="1128" y="40" width="24" height="18" fill="#3A2008" rx="1"/>
  <rect x="1168" y="40" width="24" height="18" fill="#3A2008" rx="1"/>
  <!-- Tower battlement -->
  <rect x="1125" y="14" width="18" height="16" fill="#A87838"/>
  <rect x="1152" y="14" width="18" height="16" fill="#A87838"/>
  <rect x="1179" y="14" width="18" height="16" fill="#A87838"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND — street receding to far piazza            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Mid-street distant buildings — hazy in afternoon heat -->
  <rect x="340" y="260" width="200" height="340" fill="#C8A868" opacity="0.7"/>
  <rect x="660" y="280" width="200" height="320" fill="#C09858" opacity="0.7"/>
  <!-- A distant campanile / bell tower, centre back -->
  <rect x="550" y="80" width="60" height="310" fill="#B89060" opacity="0.8"/>
  <rect x="548" y="76" width="64" height="12" fill="#C8A070" opacity="0.8"/>
  <rect x="544" y="68" width="72" height="12" fill="#B89060" opacity="0.7"/>
  <!-- Bell arch opening in tower -->
  <rect x="558" y="92" width="20" height="28" fill="#3A2808" opacity="0.8" rx="1"/>
  <path d="M 558,92 Q 568,82 578,92" fill="#2A1A08" opacity="0.8"/>
  <!-- Campanile bell hint -->
  <ellipse cx="568" cy="108" rx="6" ry="5" fill="#B08040" opacity="0.5"/>
  <!-- Far street arch connecting buildings -->
  <rect x="780" y="290" width="80" height="310" fill="#C09858" opacity="0.6"/>
  <path d="M 780,290 Q 820,260 860,290" fill="#B08848" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- COBBLESTONE STREET FLOOR                              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="530" width="1200" height="145" fill="url(#cobble_floor)"/>
  <!-- Perspective guide lines for cobbles -->
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#7A6A50" stroke-width="2" opacity="0.5"/>
  <!-- Individual cobble rows — approximate -->
  <line x1="0" y1="550" x2="1200" y2="550" stroke="#6A5A42" stroke-width="1.5" opacity="0.35"/>
  <line x1="0" y1="570" x2="1200" y2="570" stroke="#6A5A42" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#6A5A42" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="612" x2="1200" y2="612" stroke="#6A5A42" stroke-width="1.5" opacity="0.28"/>
  <line x1="0" y1="636" x2="1200" y2="636" stroke="#6A5A42" stroke-width="1.5" opacity="0.25"/>
  <!-- Cobble column lines (perspective fan) -->
  <line x1="600" y1="530" x2="0" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="200" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="400" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="600" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="800" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="1000" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="530" x2="1200" y2="675" stroke="#6A5A42" stroke-width="1" opacity="0.2"/>
  <!-- A bit of irregular cobble texture -->
  <ellipse cx="200" cy="560" rx="18" ry="7" fill="#7A6848" opacity="0.3"/>
  <ellipse cx="380" cy="580" rx="22" ry="8" fill="#7A6848" opacity="0.25"/>
  <ellipse cx="800" cy="555" rx="20" ry="7" fill="#7A6848" opacity="0.3"/>
  <ellipse cx="1050" cy="575" rx="16" ry="6" fill="#7A6848" opacity="0.25"/>
  <!-- Street gutter line centre -->
  <line x1="580" y1="530" x2="620" y2="675" stroke="#5A4A38" stroke-width="3" opacity="0.35"/>
  <!-- Shadow — left building shadow across street -->
  <path d="M 340,530 L 340,675 L 0,675 L 0,530" fill="#1A1208" opacity="0.18"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TYBALT — centre left, aggressive stance, sword drawn  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Tybalt's shadow on cobbles -->
  <ellipse cx="430" cy="545" rx="35" ry="10" fill="#1A1208" opacity="0.4"/>
  <!-- His dark cape / cloak flowing behind -->
  <path d="M 415,470 Q 395,490 390,530" fill="#2A1810" opacity="0.85"/>
  <!-- Body — dark doublet, Capulet red trim -->
  <rect x="408" y="430" width="44" height="100" fill="#1E1810" rx="3"/>
  <!-- Red trim on shoulders / collar -->
  <path d="M 408,435 Q 430,428 452,435" fill="#8B1A20" opacity="0.9"/>
  <!-- Left leg — lunging stance -->
  <rect x="408" y="525" width="18" height="60" fill="#1E1810" rx="2" transform="rotate(-10 408 525)"/>
  <!-- Right leg — back leg planted -->
  <rect x="430" y="528" width="18" height="58" fill="#1E1810" rx="2" transform="rotate(8 430 528)"/>
  <!-- Boots -->
  <rect x="403" y="575" width="24" height="15" fill="#3A2818" rx="2"/>
  <rect x="424" y="578" width="22" height="14" fill="#3A2818" rx="2"/>
  <!-- Head — turned toward Mercutio, arrogant -->
  <circle cx="430" cy="418" r="22" fill="#C09070"/>
  <!-- Dark hair — Tybalt, the "King of Cats" -->
  <ellipse cx="430" cy="406" rx="23" ry="14" fill="#1A1008"/>
  <path d="M 409,412 Q 406,425 408,440" fill="none" stroke="#1A1008" stroke-width="6" stroke-linecap="round"/>
  <path d="M 451,412 Q 454,425 452,440" fill="none" stroke="#1A1008" stroke-width="6" stroke-linecap="round"/>
  <!-- Tybalt's face — cold eyes, sneer -->
  <circle cx="424" cy="420" r="3.5" fill="#2A1808"/>
  <circle cx="437" cy="420" r="3.5" fill="#2A1808"/>
  <!-- Thin contemptuous brow -->
  <path d="M 420,415 Q 424,412 428,414" fill="none" stroke="#3A2010" stroke-width="2"/>
  <path d="M 433,414 Q 437,411 441,415" fill="none" stroke="#3A2010" stroke-width="2"/>
  <!-- Sneer mouth -->
  <path d="M 423,427 Q 430,432 437,427" fill="none" stroke="#9A5040" stroke-width="2" stroke-linecap="round"/>
  <!-- Sword arm — extended forward with blade -->
  <path d="M 452,450 Q 490,440 530,420" fill="none" stroke="#C09070" stroke-width="11" stroke-linecap="round"/>
  <!-- Sword — thin Italian rapier catching light -->
  <line x1="508" y1="430" x2="650" y2="370" stroke="#D8D0B8" stroke-width="3"/>
  <line x1="508" y1="430" x2="512" y2="418" stroke="#C8C0A8" stroke-width="4"/>
  <!-- Crossguard -->
  <line x1="496" y1="435" x2="524" y2="425" stroke="#A09070" stroke-width="5"/>
  <!-- Hilt -->
  <ellipse cx="490" cy="438" rx="9" ry="6" fill="#C8A050"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MERCUTIO — right of centre, wounded, falling         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Mercutio's shadow -->
  <ellipse cx="760" cy="548" rx="38" ry="11" fill="#1A1208" opacity="0.4"/>
  <!-- Cape — vivid colour, he's colourful and theatrical -->
  <path d="M 745,460 Q 790,450 800,510 Q 790,535 780,545" fill="#4A1A60" opacity="0.85"/>
  <!-- Body — fine doublet, he's not Capulet not Montague (grey/teal) -->
  <rect x="732" y="430" width="48" height="105" fill="#3A5A48" rx="3" transform="rotate(-5 732 430)"/>
  <!-- He is staggering — body tilted -->
  <!-- Head — thrown back a little, pain -->
  <circle cx="762" cy="415" r="23" fill="#C8A070" transform="rotate(10 762 415)"/>
  <!-- Hair — tousled, free-spirited -->
  <ellipse cx="762" cy="403" rx="24" ry="15" fill="#4A2810"/>
  <path d="M 741,410 Q 736,428 740,448" fill="none" stroke="#3A2008" stroke-width="6" stroke-linecap="round"/>
  <path d="M 783,408 Q 790,422 786,442" fill="none" stroke="#3A2008" stroke-width="6" stroke-linecap="round"/>
  <!-- Mercutio face — wild-eyed, defiant even now -->
  <circle cx="755" cy="418" r="3.5" fill="#2A1808"/>
  <circle cx="769" cy="416" r="3.5" fill="#2A1808"/>
  <path d="M 753,413 Q 757,410 762,412" fill="none" stroke="#3A2010" stroke-width="2"/>
  <!-- His mouth — "A plague on both your houses!" -->
  <path d="M 754,426 Q 762,430 770,426" fill="none" stroke="#9A4030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wound — hand pressed to side -->
  <path d="M 745,480 Q 730,472 720,465" fill="none" stroke="#C8A070" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="718" cy="463" rx="10" ry="7" fill="#C8A070"/>
  <!-- Blood hint — dark stain on doublet -->
  <ellipse cx="754" cy="475" rx="14" ry="10" fill="#6A0A18" opacity="0.55"/>
  <!-- Other arm — grabs wall for support -->
  <path d="M 778" y1="450" x2="812,455" fill="none"/>
  <path d="M 778,450 Q 808,452 820,460" fill="none" stroke="#C8A070" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs — one buckling -->
  <rect x="740" y="530" width="18" height="55" fill="#3A5A48" rx="2" transform="rotate(-15 740 530)"/>
  <rect x="760" y="532" width="18" height="52" fill="#3A5A48" rx="2" transform="rotate(5 760 532)"/>
  <!-- Boots Mercutio -->
  <rect x="724" y="572" width="26" height="14" fill="#2A2018" rx="2"/>
  <rect x="762" y="576" width="24" height="13" fill="#2A2018" rx="2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BENVOLIO — far right, hand on Romeo's arm, pulling    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Small, partial figure, background right -->
  <ellipse cx="1000" cy="545" rx="22" ry="8" fill="#1A1208" opacity="0.3"/>
  <rect x="987" y="445" width="36" height="100" fill="#5A7840" rx="3" opacity="0.85"/>
  <circle cx="1005" cy="432" r="18" fill="#D0A870" opacity="0.85"/>
  <ellipse cx="1005" cy="421" rx="19" ry="12" fill="#6A4820" opacity="0.85"/>
  <circle cx="999" cy="435" r="2.5" fill="#2A1808" opacity="0.8"/>
  <circle cx="1011" cy="435" r="2.5" fill="#2A1808" opacity="0.8"/>
  <path d="M 999,441 Q 1005,444 1011,441" fill="none" stroke="#8A5030" stroke-width="1.5" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ONLOOKERS — distant silhouettes, gathering crowd      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Left side onlooker cluster -->
  <circle cx="120" cy="490" r="16" fill="#1A1208" opacity="0.65"/>
  <rect x="110" y="504" width="20" height="55" fill="#1A1208" opacity="0.65"/>
  <circle cx="158" cy="498" r="14" fill="#2A1A10" opacity="0.6"/>
  <rect x="148" y="510" width="18" height="48" fill="#2A1A10" opacity="0.6"/>
  <!-- Right side onlookers near wall -->
  <circle cx="870" cy="488" r="15" fill="#2A1A10" opacity="0.55"/>
  <rect x="860" y="500" width="20" height="52" fill="#2A1A10" opacity="0.55"/>
  <circle cx="908" cy="494" r="14" fill="#1A1208" opacity="0.5"/>
  <rect x="898" y="506" width="18" height="48" fill="#1A1208" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ATMOSPHERIC DETAILS                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Dust / heat haze near ground -->
  <ellipse cx="600" cy="540" rx="400" ry="25" fill="#D4AA60" opacity="0.07"/>
  <!-- Sun through arch — light column from the campanile side -->
  <rect width="1200" height="675" fill="url(#sun_haze)"/>
  <!-- A dropped glove on cobblestones — theatrical detail -->
  <ellipse cx="560" cy="558" rx="14" ry="8" fill="#C8B070" opacity="0.5" transform="rotate(-20 560 558)"/>
  <!-- Potted urns outside ground level shop -->
  <ellipse cx="335" cy="548" rx="12" ry="15" fill="#9A6030" opacity="0.6"/>
  <rect x="323" y="530" width="24" height="20" fill="#8A5828" opacity="0.65"/>
  <ellipse cx="335" cy="530" rx="12" ry="5" fill="#A07038" opacity="0.7"/>

  <!-- Label -->
  <text x="60" y="650" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#D8D0B8" opacity="0.65" font-style="italic">A Street in Verona · A Hot Afternoon · The Duel</text>
</svg>
