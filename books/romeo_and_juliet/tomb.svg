<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="vault_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120E10"/>
      <stop offset="50%" stop-color="#1A1418"/>
      <stop offset="100%" stop-color="#201820"/>
    </linearGradient>
    <linearGradient id="floor_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2428"/>
      <stop offset="100%" stop-color="#181418"/>
    </linearGradient>
    <radialGradient id="candle_glow_c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C840" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F5A020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5A020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle_glow_l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C840" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5A020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle_glow_r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C840" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5A020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="door_light" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2A3060" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2A3060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sarcophagus_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A5060"/>
      <stop offset="40%" stop-color="#4A4458"/>
      <stop offset="100%" stop-color="#2A2830"/>
    </linearGradient>
  </defs>

  <!-- Complete darkness — the vault -->
  <rect width="1200" height="675" fill="url(#vault_wall)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VAULT ARCHITECTURE — ancient stone arches             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Main barrel vault arch — back wall -->
  <path d="M 0,0 L 0,350 Q 0,200 200,120 Q 400,60 600,50 Q 800,60 1000,120 Q 1200,200 1200,350 L 1200,0 Z" fill="#1A1418"/>
  <!-- Arch outline — slightly lighter stone -->
  <path d="M 100,380 Q 100,200 300,130 Q 500,70 600,62 Q 700,70 900,130 Q 1100,200 1100,380" fill="none" stroke="#2A2430" stroke-width="12"/>
  <path d="M 150,400 Q 150,220 340,150 Q 520,90 600,80 Q 680,90 860,150 Q 1050,220 1050,400" fill="none" stroke="#221E28" stroke-width="8"/>

  <!-- Vault ribs — gothic stone architecture -->
  <path d="M 0,675 Q 200,400 600,100" fill="none" stroke="#201C24" stroke-width="6" opacity="0.6"/>
  <path d="M 1200,675 Q 1000,400 600,100" fill="none" stroke="#201C24" stroke-width="6" opacity="0.6"/>
  <path d="M 300,675 Q 420,420 600,120" fill="none" stroke="#1E1A22" stroke-width="4" opacity="0.5"/>
  <path d="M 900,675 Q 780,420 600,120" fill="none" stroke="#1E1A22" stroke-width="4" opacity="0.5"/>

  <!-- Left niche — family tomb alcoves, dark -->
  <rect x="20" y="200" width="130" height="200" fill="#0E0C10" rx="4"/>
  <path d="M 20,200 Q 85,168 150,200" fill="#120E14"/>
  <!-- Stone face of niche, carved -->
  <path d="M 25,205 Q 85,176 145,205" fill="none" stroke="#2A2430" stroke-width="3" opacity="0.5"/>
  <!-- Dark slab inside niche -->
  <rect x="35" y="230" width="100" height="120" fill="#181420" opacity="0.8"/>
  <line x1="35" y1="290" x2="135" y2="290" stroke="#2A2430" stroke-width="2" opacity="0.4"/>
  <!-- Latin inscription hint on niche -->
  <text x="85" y="270" font-family="Georgia,serif" font-size="9" fill="#3A3445" opacity="0.6" text-anchor="middle">CAPULETORUM</text>

  <!-- Right niche -->
  <rect x="1050" y="200" width="130" height="200" fill="#0E0C10" rx="4"/>
  <path d="M 1050,200 Q 1115,168 1180,200" fill="#120E14"/>
  <path d="M 1055,205 Q 1115,176 1175,205" fill="none" stroke="#2A2430" stroke-width="3" opacity="0.5"/>
  <rect x="1065" y="230" width="100" height="120" fill="#181420" opacity="0.8"/>
  <line x1="1065" y1="290" x2="1165" y2="290" stroke="#2A2430" stroke-width="2" opacity="0.4"/>

  <!-- Stone floor — cracked flagstones -->
  <rect x="0" y="490" width="1200" height="185" fill="url(#floor_stone)"/>
  <rect x="0" y="488" width="1200" height="6" fill="#2A2430" opacity="0.7"/>
  <!-- Flagstone joints -->
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#161218" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#161218" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="618" x2="1200" y2="618" stroke="#161218" stroke-width="2" opacity="0.45"/>
  <!-- Vertical joints -->
  <line x1="200" y1="490" x2="200" y2="675" stroke="#161218" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="490" x2="400" y2="675" stroke="#161218" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="490" x2="600" y2="675" stroke="#161218" stroke-width="1.5" opacity="0.35"/>
  <line x1="800" y1="490" x2="800" y2="675" stroke="#161218" stroke-width="1.5" opacity="0.4"/>
  <line x1="1000" y1="490" x2="1000" y2="675" stroke="#161218" stroke-width="1.5" opacity="0.4"/>
  <!-- A crack in the stone floor — age -->
  <path d="M 700,510 Q 710,540 705,570 Q 715,600 708,630" fill="none" stroke="#100C12" stroke-width="2" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ENTRANCE — faint moonlight from vault door above      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="480" y="0" width="240" height="160" fill="url(#door_light)"/>
  <!-- Faint blue-grey moonlight shaft -->
  <path d="M 480,0 L 440,160 L 760,160 L 720,0" fill="#1A2040" opacity="0.18"/>
  <!-- Vault door arch framing -->
  <rect x="470" y="0" width="260" height="155" fill="none"/>
  <path d="M 470,155 Q 470,60 600,20 Q 730,60 730,155" fill="none" stroke="#2A2838" stroke-width="10"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JULIET'S SARCOPHAGUS — centre, lit by candles         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Stone bier / sarcophagus base -->
  <rect x="320" y="390" width="560" height="110" fill="url(#sarcophagus_stone)" rx="6"/>
  <rect x="316" y="386" width="568" height="14" fill="#6A6070" rx="3"/>
  <!-- Carved side panel lines -->
  <line x1="360" y1="400" x2="360" y2="498" stroke="#3A3440" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="400" x2="500" y2="498" stroke="#3A3440" stroke-width="2" opacity="0.5"/>
  <line x1="700" y1="400" x2="700" y2="498" stroke="#3A3440" stroke-width="2" opacity="0.5"/>
  <line x1="840" y1="400" x2="840" y2="498" stroke="#3A3440" stroke-width="2" opacity="0.5"/>
  <!-- Panel diamond motifs (decorative) -->
  <path d="M 415,435 L 430,450 L 415,465 L 400,450 Z" fill="none" stroke="#5A5068" stroke-width="1.5" opacity="0.4"/>
  <path d="M 780,435 L 795,450 L 780,465 L 765,450 Z" fill="none" stroke="#5A5068" stroke-width="1.5" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- JULIET — lying on the stone bier, "sleeping"          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- White burial gown — the same as her wedding gown      -->
  <!-- Her body lying horizontal -->
  <rect x="360" y="355" width="480" height="36" fill="#E8E0D0" rx="8"/>
  <!-- Gown folds — subtle -->
  <path d="M 360,360 Q 440,368 530,362 Q 620,356 700,362 Q 780,368 840,360" fill="none" stroke="#D0C8B8" stroke-width="2" opacity="0.5"/>
  <path d="M 360,375 Q 460,382 560,376 Q 640,370 740,376 Q 800,381 840,375" fill="none" stroke="#D0C8B8" stroke-width="1.5" opacity="0.4"/>
  <!-- Her hands folded on chest, a flower between them -->
  <ellipse cx="610" cy="362" rx="28" ry="9" fill="#ECD8B8" opacity="0.9"/>
  <ellipse cx="610" cy="358" rx="18" ry="7" fill="#E8D0B0" opacity="0.85"/>
  <!-- Flower — lily -->
  <circle cx="610" cy="352" r="8" fill="#E8E0D0"/>
  <ellipse cx="604" cy="348" rx="5" ry="8" fill="#F0E8D8" opacity="0.8" transform="rotate(-30 604 348)"/>
  <ellipse cx="616" cy="348" rx="5" ry="8" fill="#F0E8D8" opacity="0.8" transform="rotate(30 616 348)"/>
  <!-- Her head — serene, eyes closed, dark hair spread -->
  <circle cx="790" cy="358" r="22" fill="#ECC8A0"/>
  <!-- Dark hair spread out on stone -->
  <ellipse cx="790" cy="348" rx="30" ry="14" fill="#2A1808"/>
  <path d="M 810,340 Q 820,355 818,375" fill="none" stroke="#1A1008" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 770,340 Q 760,355 762,374" fill="none" stroke="#1A1008" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- Hair flowing behind head onto stone -->
  <ellipse cx="815" cy="355" rx="18" ry="10" fill="#2A1808" opacity="0.85"/>
  <!-- Eyes closed — long lashes visible -->
  <path d="M 780,358 Q 788,362 797,358" fill="none" stroke="#5A2808" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 780,358 Q 788,354 797,358" fill="none" stroke="#C8A080" stroke-width="1.5" opacity="0.5"/>
  <!-- Small pale mouth -->
  <path d="M 782,368 Q 789,371 797,368" fill="none" stroke="#A07060" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pearl ornament in hair -->
  <circle cx="790" cy="342" r="5" fill="#E8D8C0" opacity="0.8"/>
  <circle cx="790" cy="342" r="3" fill="#F0E8D0" opacity="0.9"/>

  <!-- Central candle glow — over Juliet -->
  <ellipse cx="600" cy="370" rx="280" ry="140" fill="url(#candle_glow_c)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CANDLES — three pairs flanking the bier               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Left candle pair -->
  <rect x="295" y="330" width="8" height="60" fill="#E8E0C8"/>
  <rect x="315" y="340" width="7" height="52" fill="#E8E0C8"/>
  <!-- Flames left -->
  <ellipse cx="299" cy="327" rx="5" ry="8" fill="#F5C840" opacity="0.9"/>
  <ellipse cx="299" cy="322" rx="3" ry="5" fill="#FFEE80" opacity="0.8"/>
  <ellipse cx="318" cy="337" rx="4" ry="7" fill="#F5C840" opacity="0.9"/>
  <ellipse cx="318" cy="332" rx="3" ry="4" fill="#FFEE80" opacity="0.8"/>
  <!-- Candle glow left -->
  <ellipse cx="308" cy="340" rx="80" ry="60" fill="url(#candle_glow_l)"/>
  <!-- Candle drip wax detail -->
  <path d="M 298,335 Q 296,345 297,355" fill="none" stroke="#E0D8C0" stroke-width="2" opacity="0.5"/>

  <!-- Right candle pair -->
  <rect x="897" y="330" width="8" height="60" fill="#E8E0C8"/>
  <rect x="878" y="342" width="7" height="50" fill="#E8E0C8"/>
  <!-- Flames right -->
  <ellipse cx="901" cy="327" rx="5" ry="8" fill="#F5C840" opacity="0.9"/>
  <ellipse cx="901" cy="322" rx="3" ry="5" fill="#FFEE80" opacity="0.8"/>
  <ellipse cx="881" cy="339" rx="4" ry="7" fill="#F5C840" opacity="0.9"/>
  <ellipse cx="881" cy="334" rx="3" ry="4" fill="#FFEE80" opacity="0.8"/>
  <!-- Candle glow right -->
  <ellipse cx="890" cy="342" rx="80" ry="60" fill="url(#candle_glow_r)"/>

  <!-- Centre candle — head of bier -->
  <rect x="750" y="300" width="9" height="66" fill="#E8E0C8"/>
  <ellipse cx="754" cy="297" rx="6" ry="9" fill="#F5C840" opacity="0.95"/>
  <ellipse cx="754" cy="292" rx="3.5" ry="6" fill="#FFEE80" opacity="0.85"/>
  <!-- Wax pooling -->
  <ellipse cx="754" cy="365" rx="7" ry="3" fill="#D8D0B8" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROMEO — kneeling at the bier, hands on her hands      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Romeo's shadow on floor -->
  <ellipse cx="510" cy="510" rx="38" ry="12" fill="#100C12" opacity="0.5"/>
  <!-- Dark cloak — he's rushed here, cloak still on him -->
  <path d="M 488,390 Q 468,420 465,480 Q 462,520 465,545" fill="#1A1A28" opacity="0.85"/>
  <path d="M 548,388 Q 565,415 568,480 Q 568,518 565,545" fill="#1A1A28" opacity="0.85"/>
  <!-- Body — doubled forward over the bier -->
  <rect x="490" y="370" width="70" height="140" fill="#1E1A2A" rx="4"/>
  <!-- His arms reaching forward onto the sarcophagus -->
  <path d="M 492,395 Q 520,385 555,380" fill="none" stroke="#C0906A" stroke-width="11" stroke-linecap="round"/>
  <path d="M 558,380 Q 585,375 610,370" fill="none" stroke="#C0906A" stroke-width="9" stroke-linecap="round"/>
  <!-- His hands touching hers -->
  <ellipse cx="558" cy="377" rx="12" ry="8" fill="#C09068"/>
  <!-- Head — bowed, pressed almost to forehead of bier, grief -->
  <circle cx="520" cy="358" r="22" fill="#C89068"/>
  <!-- Dark hair — dishevelled from running -->
  <ellipse cx="520" cy="346" rx="23" ry="15" fill="#1A1008"/>
  <path d="M 500,350 Q 496,368 498,388" fill="none" stroke="#1A1008" stroke-width="6" stroke-linecap="round"/>
  <path d="M 541,350 Q 545,366 543,384" fill="none" stroke="#1A1008" stroke-width="6" stroke-linecap="round"/>
  <!-- Face — turned slightly toward her, eyes open, anguish -->
  <circle cx="514" cy="360" r="3.5" fill="#2A1808"/>
  <circle cx="526" cy="359" r="3.5" fill="#2A1808"/>
  <!-- Mouth open slightly — speaking his last words -->
  <path d="M 513,368 Q 520,373 527,368" fill="none" stroke="#9A5040" stroke-width="2" stroke-linecap="round"/>
  <!-- A tear on his cheek -->
  <ellipse cx="510" cy="366" rx="2" ry="4" fill="#8AB0D8" opacity="0.6"/>
  <!-- The vial — poison, small on the floor -->
  <rect x="465" y="490" width="10" height="22" fill="#5A7A60" rx="4" opacity="0.7"/>
  <ellipse cx="470" cy="490" rx="5" ry="4" fill="#6A8A70" opacity="0.7"/>
  <!-- Vial faint glow -->
  <ellipse cx="470" cy="498" rx="18" ry="12" fill="#5A7A60" opacity="0.1"/>
  <!-- His knees on stone floor -->
  <rect x="490" y="495" width="25" height="20" fill="#1E1A2A" rx="4"/>
  <rect x="535" y="498" width="22" height="18" fill="#1E1A2A" rx="4"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PARIS — slumped at edge of vault, already dead        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Paris — barely visible in shadow, far left corner -->
  <ellipse cx="130" cy="545" rx="40" ry="12" fill="#100C12" opacity="0.45"/>
  <!-- Slumped body -->
  <rect x="80" y="460" width="32" height="90" fill="#2A2838" rx="3" opacity="0.7" transform="rotate(-25 80 460)"/>
  <!-- Head lolled to side -->
  <circle cx="118" cy="452" r="18" fill="#C0906A" opacity="0.65"/>
  <ellipse cx="118" cy="442" rx="19" ry="12" fill="#4A3018" opacity="0.65"/>
  <!-- Eyes closed -->
  <path d="M 111,454 Q 118,458 125,454" fill="none" stroke="#5A2808" stroke-width="2" opacity="0.6"/>
  <!-- His sword — fallen beside him -->
  <line x1="150" y1="510" x2="80" y2="540" stroke="#D0C8A8" stroke-width="3" opacity="0.5"/>
  <line x1="155" y1="505" x2="162" y2="520" stroke="#A09070" stroke-width="4" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FLOWERS — brought by Paris for Juliet's tomb          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Scattered flowers near Paris -->
  <circle cx="175" cy="505" r="6" fill="#8B1A30" opacity="0.6"/>
  <circle cx="190" cy="518" r="5" fill="#8B1A30" opacity="0.5"/>
  <circle cx="210" cy="498" r="6" fill="#9B2A40" opacity="0.55"/>
  <!-- Petals scattered -->
  <ellipse cx="230" cy="510" rx="5" ry="3" fill="#8B1A30" opacity="0.4" transform="rotate(-30 230 510)"/>
  <ellipse cx="165" cy="525" rx="4" ry="2.5" fill="#8B1A30" opacity="0.35" transform="rotate(15 165 525)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- COBWEB / DUST — age of the tomb                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Cobweb upper left corner -->
  <path d="M 20,100 Q 40,130 60,110 Q 50,90 20,100" fill="none" stroke="#3A3445" stroke-width="1" opacity="0.35"/>
  <path d="M 20,100 L 60,110" stroke="#3A3445" stroke-width="0.8" opacity="0.3"/>
  <path d="M 20,100 L 40,140" stroke="#3A3445" stroke-width="0.8" opacity="0.3"/>
  <!-- Dust motes in candle beams -->
  <circle cx="560" cy="310" r="1.5" fill="#E8D0A0" opacity="0.5"/>
  <circle cx="640" cy="295" r="1" fill="#E8D0A0" opacity="0.4"/>
  <circle cx="690" cy="320" r="1.5" fill="#E8D0A0" opacity="0.45"/>
  <circle cx="500" cy="340" r="1" fill="#E8D0A0" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- WARM LIGHT POOLING on the floor under candles         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <ellipse cx="600" cy="510" rx="300" ry="60" fill="#F5C040" opacity="0.05"/>
  <ellipse cx="310" cy="490" rx="100" ry="35" fill="#F5C040" opacity="0.04"/>
  <ellipse cx="900" cy="490" rx="100" ry="35" fill="#F5C040" opacity="0.04"/>

  <!-- Label -->
  <text x="60" y="650" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#A89898" opacity="0.55" font-style="italic">The Capulet Vault · Before Dawn · The Final Hour</text>
</svg>
